<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MovieBox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#101114;--card:#28292E;--accent:#1CB7FF;--green:#2FF58B;--gold:#FFDA6B;--text:#E8E8E8;--muted:#888;--sidebar:220px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* Sidebar */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:#18191D;padding:20px 0;z-index:100;display:flex;flex-direction:column;overflow-y:auto}
.sidebar .logo{font-size:24px;font-weight:800;padding:0 20px 30px;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--muted);font-size:15px;transition:.2s}
.sidebar nav a:hover,.sidebar nav a.active{color:#fff;background:rgba(28,183,255,.1)}
.sidebar nav a .icon{font-size:18px;width:24px;text-align:center}
.sidebar .divider{height:1px;background:#2a2b30;margin:12px 20px}
.sidebar .sidebar-label{font-size:11px;text-transform:uppercase;color:var(--muted);padding:8px 20px;letter-spacing:1px}

/* Main */
.main{margin-left:var(--sidebar);min-height:100vh}

/* Topbar */
.topbar{position:sticky;top:0;z-index:90;background:rgba(16,17,20,.95);backdrop-filter:blur(10px);padding:16px 30px;display:flex;align-items:center;gap:16px}
.search-box{flex:1;max-width:500px;position:relative}
.search-box input{width:100%;padding:10px 16px 10px 40px;background:#1e1f24;border:1px solid #333;border-radius:8px;color:#fff;font-size:14px;outline:none}
.search-box input:focus{border-color:var(--accent)}
.search-box .s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.top-actions{margin-left:auto;display:flex;gap:12px;align-items:center}
.top-actions button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;padding:6px}
.top-actions button:hover{color:#fff}

/* Hero */
.hero{position:relative;height:420px;overflow:hidden;margin:0 30px 30px;border-radius:16px}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s}
.hero-slide.active{opacity:1}
.hero-slide .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-slide .hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,rgba(16,17,20,.95) 0%,rgba(16,17,20,.6) 50%,rgba(16,17,20,.3) 100%)}
.hero-slide .hero-info{position:relative;z-index:2;padding:60px 50px;height:100%;display:flex;flex-direction:column;justify-content:center}
.hero-slide .hero-title{font-size:42px;font-weight:800;line-height:1.1;margin-bottom:12px;max-width:500px}
.hero-slide .hero-meta{display:flex;gap:12px;align-items:center;margin-bottom:16px;font-size:14px;color:var(--muted)}
.hero-slide .hero-meta .rating{color:var(--gold);font-weight:700}
.hero-slide .hero-desc{font-size:15px;line-height:1.6;color:#bbb;max-width:500px;max-height:80px;overflow:hidden;margin-bottom:20px}
.hero-slide .hero-btns{display:flex;gap:12px}
.btn{padding:10px 24px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;border:none;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--green));color:#000}
.btn-primary:hover{transform:scale(1.05)}
.btn-secondary{background:rgba(255,255,255,.1);color:#fff}
.btn-secondary:hover{background:rgba(255,255,255,.2)}
.hero-dots{position:absolute;bottom:20px;right:50px;display:flex;gap:8px;z-index:5}
.hero-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.3s}
.hero-dot.active{background:var(--accent);width:30px;border-radius:5px}

/* Section */
.section{padding:0 30px;margin-bottom:40px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-head h2{font-size:20px;font-weight:700}
.section-head .see-all{color:var(--accent);font-size:13px;cursor:pointer}

/* Row scroll */
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{height:4px}
.row::-webkit-scrollbar-thumb{background:#333;border-radius:4px}

/* Card */
.card{flex:0 0 180px;scroll-snap-align:start;cursor:pointer;transition:transform .2s}
.card:hover{transform:scale(1.05)}
.card .poster{width:100%;height:270px;border-radius:12px;overflow:hidden;position:relative;background:var(--card)}
.card .poster img{width:100%;height:100%;object-fit:cover}
.card .poster .no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:40px}
.card .poster .rating-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);color:var(--gold);font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
.card .poster .year-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px}
.card .card-title{margin-top:8px;font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Wide card for Continue Watching */
.card-wide{flex:0 0 280px}
.card-wide .poster{height:158px}

/* Genre pills */
.genres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding:0 30px}
.genre-pill{padding:8px 18px;background:var(--card);border-radius:20px;font-size:13px;cursor:pointer;transition:.2s;border:1px solid transparent}
.genre-pill:hover,.genre-pill.active{background:var(--accent);color:#000;border-color:var(--accent)}

/* Detail modal */
.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);overflow-y:auto;padding:40px 20px}
.modal-overlay.open{display:flex;justify-content:center;align-items:flex-start}
.modal{background:#1a1b1f;border-radius:16px;max-width:900px;width:100%;overflow:hidden;position:relative}
.modal-close{position:absolute;top:16px;right:16px;z-index:10;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:24px;width:36px;height:36px;border-radius:50%;cursor:pointer}
.modal-hero{position:relative;height:400px;overflow:hidden}
.modal-hero .mh-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.4)}
.modal-hero .mh-info{position:relative;z-index:2;padding:60px 40px 30px;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.modal-hero .mh-title{font-size:36px;font-weight:800;margin-bottom:10px}
.modal-hero .mh-meta{display:flex;gap:14px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:12px}
.modal-hero .mh-meta .rating{color:var(--gold);font-weight:700}
.modal-hero .mh-btns{display:flex;gap:10px}
.modal-body{padding:30px 40px}
.modal-body h3{font-size:18px;margin-bottom:12px}
.modal-body .synopsis{color:#bbb;line-height:1.7;margin-bottom:24px}
.modal-body .cast-row{display:flex;gap:12px;overflow-x:auto;margin-bottom:24px}
.cast-card{flex:0 0 100px;text-align:center}
.cast-card img{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:6px}
.cast-card .cast-name{font-size:11px;font-weight:600}
.cast-card .cast-char{font-size:10px;color:var(--muted)}

/* Player modal */
.player-overlay{display:none;position:fixed;inset:0;z-index:300;background:#000}
.player-overlay.open{display:flex;flex-direction:column}
.player-topbar{display:flex;align-items:center;padding:12px 20px;background:rgba(0,0,0,.8);gap:12px}
.player-topbar .back-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
.player-topbar .player-title{font-size:15px;font-weight:600}
.player-topbar .src-select{margin-left:auto;background:#222;border:1px solid #444;color:#fff;padding:6px 10px;border-radius:6px;font-size:12px}
.player-frame{flex:1;border:none;background:#000}
.player-sources{display:flex;gap:8px;padding:10px 20px;background:rgba(0,0,0,.8);overflow-x:auto}
.src-btn{padding:6px 14px;background:#222;border:1px solid #444;border-radius:6px;color:var(--muted);font-size:12px;cursor:pointer;transition:.2s}
.src-btn:hover,.src-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}

/* Tabs */
.content-tabs{display:flex;gap:4px;padding:0 30px;margin-bottom:20px}
.tab-btn{padding:8px 20px;background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.tab-btn:hover{color:#fff}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}

/* Loading */
.loading{text-align:center;padding:60px;color:var(--muted)}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}

/* Mobile */
@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0}
  .topbar{padding:12px 16px}
  .section{padding:0 16px}
  .hero{height:300px;margin:0 16px 20px;border-radius:12px}
  .hero-slide .hero-info{padding:30px 24px}
  .hero-slide .hero-title{font-size:26px}
  .card{flex:0 0 140px}
  .card .poster{height:210px}
  .modal-hero{height:260px}
  .modal-hero .mh-info{padding:30px 20px 20px}
  .modal-hero .mh-title{font-size:24px}
  .modal-body{padding:20px}
  .genres{padding:0 16px}
  .content-tabs{padding:0 16px}
  .bottom-bar{display:flex!important}
}
.bottom-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:#18191D;z-index:100;justify-content:space-around;padding:8px 0}
.bottom-bar .bb-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10px;cursor:pointer;padding:4px 12px}
.bottom-bar .bb-item.active{color:var(--accent)}
.bottom-bar .bb-item .bb-icon{font-size:20px}

/* Age gate */
.age-gate{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.age-gate h2{font-size:28px}
.age-gate p{color:var(--muted);max-width:400px;text-align:center}
.age-gate .age-btns{display:flex;gap:16px}
.age-gate .age-btns button{padding:12px 36px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;border:none}

/* EP selector */
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
.ep-card{background:#222;border-radius:10px;overflow:hidden;cursor:pointer;transition:.2s}
.ep-card:hover{background:#2a2a2a}
.ep-card .ep-thumb{width:100%;height:135px;object-fit:cover;background:#181818}
.ep-card .ep-info{padding:10px 12px}
.ep-card .ep-num{font-size:12px;color:var(--accent);font-weight:700}
.ep-card .ep-title{font-size:13px;font-weight:600;margin-top:4px}

/* Season selector */
.season-sel{margin-bottom:20px}
.season-sel select{background:#222;border:1px solid #444;color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;cursor:pointer}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="logo">MovieBox</div>
  <nav>
    <a href="#" class="active" data-tab="home"><span class="icon">🏠</span> Home</a>
    <a href="#" data-tab="movies"><span class="icon">🎬</span> Movie</a>
    <a href="#" data-tab="tv"><span class="icon">📺</span> TV Show</a>
    <a href="#" data-tab="adult"><span class="icon">🔞</span> 18+</a>
    <a href="#" data-tab="mylist"><span class="icon">📋</span> My List</a>
  </nav>
  <div class="divider"></div>
  <div class="sidebar-label">Genres</div>
  <nav id="genre-nav"></nav>
</div>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div class="search-box">
      <span class="s-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search movies / TV Shows">
    </div>
    <div class="top-actions">
      <button onclick="toggleTheme()" title="Theme">🌙</button>
    </div>
  </div>

  <div id="content">
    <div class="loading"><div class="spinner"></div>Loading...</div>
  </div>
</div>

<!-- Bottom bar (mobile) -->
<div class="bottom-bar">
  <div class="bb-item active" data-tab="home"><span class="bb-icon">🏠</span>Home</div>
  <div class="bb-item" data-tab="movies"><span class="bb-icon">🎬</span>Movies</div>
  <div class="bb-item" data-tab="tv"><span class="bb-icon">📺</span>TV</div>
  <div class="bb-item" data-tab="adult"><span class="bb-icon">🔞</span>18+</div>
  <div class="bb-item" data-tab="mylist"><span class="bb-icon">📋</span>My List</div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-hero">
      <div class="mh-bg" id="modalBg"></div>
      <div class="mh-info">
        <div class="mh-title" id="modalTitle"></div>
        <div class="mh-meta" id="modalMeta"></div>
        <div class="mh-btns" id="modalBtns"></div>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Player -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-topbar">
    <button class="back-btn" onclick="closePlayer()">←</button>
    <span class="player-title" id="playerTitle"></span>
    <select class="src-select" id="srcSelect" onchange="switchSrc(this.value)"></select>
  </div>
  <iframe class="player-frame" id="playerFrame" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
  <div class="player-sources" id="playerSources"></div>
</div>

<!-- Age gate -->
<div class="age-gate" id="ageGate" style="display:none">
  <h2>🔞 Age Verification</h2>
  <p>This section contains adult content. You must be 18 or older to proceed.</p>
  <div class="age-btns">
    <button style="background:linear-gradient(135deg,var(--accent),var(--green));color:#000" onclick="verifyAge()">I am 18+ Enter</button>
    <button style="background:#333;color:#fff" onclick="denyAge()">Go Back</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ──
let currentTab = 'home';
let currentGenre = null;
let currentSearch = null;
let currentDetail = null;
let currentSources = [];
let myList = JSON.parse(localStorage.getItem('mylist') || '[]');
let ageVerified = localStorage.getItem('age_ok') === '1';

const GENRES = ['Action','Adventure','Animation','Comedy','Crime','Documentary','Drama','Family','Fantasy','Horror','Mystery','Romance','Sci-Fi','Thriller','War','Western'];
const ADULT_CATS = ['popular','milf','teen','anal','big+ass','blowjob','hardcore','lesbian','amateur','public','massage','creampie','threesome','pov','big+tits','hentai','japanese','korean','ebony','latina','russian','indian'];

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  buildGenreNav();
  loadTab('home');

  document.getElementById('searchInput').addEventListener('keyup', e => {
    if (e.key === 'Enter') {
      const q = e.target.value.trim();
      if (q) { currentSearch = q; currentTab = 'search'; loadSearch(q); }
    }
  });

  document.querySelectorAll('[data-tab]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      const tab = el.dataset.tab;
      if (tab === 'adult' && !ageVerified) { showAgeGate(); return; }
      setActiveTab(tab);
      currentGenre = null; currentSearch = null;
      loadTab(tab);
    });
  });
});

function buildGenreNav() {
  const nav = document.getElementById('genre-nav');
  GENRES.forEach(g => {
    const a = document.createElement('a');
    a.href = '#'; a.innerHTML = `<span class="icon">▸</span>${g}`;
    a.addEventListener('click', e => { e.preventDefault(); currentGenre = g.toLowerCase().replace('-','-'); setActiveTab('genre'); loadGenre(g); });
    nav.appendChild(a);
  });
}

function setActiveTab(tab) {
  currentTab = tab;
  document.querySelectorAll('[data-tab]').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
}

// ── Loaders ──
async function api(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) { console.error('API error:', url, e); return null; }
}

async function loadTab(tab) {
  const C = document.getElementById('content');
  C.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
  switch (tab) {
    case 'home': await loadHome(); break;
    case 'movies': await loadMovies(); break;
    case 'tv': await loadTV(); break;
    case 'adult': await loadAdult(); break;
    case 'mylist': loadMyList(); break;
    default: await loadHome();
  }
}

async function loadHome() {
  const [trending, tvTrending] = await Promise.all([
    api('/api/movies/trending'),
    api('/api/tv/trending')
  ]);
  const movies = trending?.results || [];
  const tvShows = tvTrending?.results || [];
  const cw = getContinueWatching();

  let html = '';

  // Hero
  if (movies.length) {
    html += '<div class="hero" id="hero">';
    movies.slice(0, 5).forEach((m, i) => {
      html += `<div class="hero-slide${i === 0 ? ' active' : ''}" onclick="openDetail(${m.id},'movie')">
        <div class="hero-bg" style="background-image:url(${m.backdrop || m.poster || ''})"></div>
        <div class="hero-info">
          <div class="hero-title">${m.title}</div>
          <div class="hero-meta"><span class="rating">★ ${m.rating || 'N/A'}</span><span>${m.year || ''}</span></div>
          <div class="hero-desc">${m.overview || ''}</div>
          <div class="hero-btns">
            <button class="btn btn-primary" onclick="event.stopPropagation();openDetail(${m.id},'movie')">▶ Watch Now</button>
            <button class="btn btn-secondary" onclick="event.stopPropagation();addToList(${JSON.stringify(m).replace(/"/g,'&quot;')})">+ My List</button>
          </div>
        </div>
      </div>`;
    });
    html += '<div class="hero-dots" id="heroDots">';
    movies.slice(0, 5).forEach((_, i) => { html += `<div class="hero-dot${i === 0 ? ' active' : ''}" onclick="goSlide(${i})"></div>`; });
    html += '</div></div>';
    setTimeout(startHero, 100);
  }

  // Continue watching
  if (cw.length) {
    html += sectionHead('Continue Watching');
    html += '<div class="row">';
    cw.forEach(m => { html += cardHTML(m, 'card-wide'); });
    html += '</div></div>';
  }

  // Trending movies
  html += sectionHead('Trending Movies');
  html += '<div class="row">';
  movies.forEach(m => { html += cardHTML(m); });
  html += '</div></div>';

  // Trending TV
  html += sectionHead('Trending TV Shows');
  html += '<div class="row">';
  tvShows.forEach(m => { html += cardHTML(m); });
  html += '</div></div>';

  document.getElementById('content').innerHTML = html;
}

async function loadMovies() {
  const d = await api('/api/movies/trending');
  const movies = d?.results || [];
  let html = '<div class="section"><h2 style="margin-bottom:16px">All Movies</h2>';
  html += '<div class="genres" style="padding:0">';
  GENRES.forEach(g => {
    html += `<div class="genre-pill${currentGenre === g.toLowerCase() ? ' active' : ''}" onclick="loadGenre('${g}')">${g}</div>`;
  });
  html += '</div><div class="grid">';
  movies.forEach(m => { html += cardHTML(m); });
  html += '</div></div>';
  document.getElementById('content').innerHTML = html;
}

async function loadTV() {
  const d = await api('/api/tv/trending');
  const shows = d?.results || [];
  let html = '<div class="section"><h2 style="margin-bottom:16px">TV Shows</h2><div class="grid">';
  shows.forEach(m => { html += cardHTML(m); });
  html += '</div></div>';
  document.getElementById('content').innerHTML = html;
}

async function loadAdult() {
  const d = await api('/api/adult/trending');
  const items = d?.results || [];
  let html = '<div class="section"><h2 style="margin-bottom:16px">🔞 Adult Content</h2>';
  html += '<div class="genres" style="padding:0">';
  ADULT_CATS.forEach(c => {
    html += `<div class="genre-pill" onclick="loadAdultCat('${c}')">${c.replace(/\+/g,' ')}</div>`;
  });
  html += '</div>';
  html += '<div class="search-box" style="max-width:400px;margin-bottom:20px">';
  html += '<span class="s-icon">🔍</span>';
  html += '<input type="text" id="adultSearch" placeholder="Search adult..." onkeyup="if(event.key===\'Enter\')searchAdult(this.value)">';
  html += '</div>';
  if (items.length) {
    html += '<div class="grid">';
    items.forEach(m => { html += adultCardHTML(m); });
    html += '</div>';
  } else {
    html += '<div class="loading" style="padding:20px;color:var(--muted)">No results. Try searching above.</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

async function loadGenre(genre) {
  currentGenre = genre.toLowerCase();
  const C = document.getElementById('content');
  C.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
  const d = await api(`/api/movies/genre/${encodeURIComponent(currentGenre)}`);
  const movies = d?.results || [];
  let html = '<div class="section"><h2 style="margin-bottom:16px">' + genre + '</h2>';
  html += '<div class="genres" style="padding:0">';
  GENRES.forEach(g => {
    html += `<div class="genre-pill${currentGenre === g.toLowerCase() ? ' active' : ''}" onclick="loadGenre('${g}')">${g}</div>`;
  });
  html += '</div><div class="grid">';
  movies.forEach(m => { html += cardHTML(m); });
  html += '</div></div>';
  C.innerHTML = html;
}

async function loadSearch(q) {
  const C = document.getElementById('content');
  C.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';
  const [mR, tvR] = await Promise.all([api(`/api/movies/search?q=${encodeURIComponent(q)}`), api(`/api/tv/search?q=${encodeURIComponent(q)}`)]);
  const movies = mR?.results || [];
  const tv = tvR?.results || [];
  let html = `<div class="section"><h2 style="margin-bottom:16px">Results for "${q}"</h2><div class="grid">`;
  [...movies, ...tv].forEach(m => { html += cardHTML(m); });
  if (!movies.length && !tv.length) html += '<div style="padding:40px;color:var(--muted)">No results found</div>';
  html += '</div></div>';
  C.innerHTML = html;
}

async function loadAdultCat(cat) {
  const C = document.getElementById('content');
  C.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
  const d = await api(`/api/adult/category/${encodeURIComponent(cat)}`);
  const items = d?.results || [];
  let html = `<div class="section"><h2 style="margin-bottom:16px">🔞 ${cat.replace(/\+/g,' ')}</h2>`;
  html += '<div class="grid">';
  items.forEach(m => { html += adultCardHTML(m); });
  html += '</div></div>';
  C.innerHTML = html;
}

async function searchAdult(q) {
  const C = document.getElementById('content');
  C.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';
  const d = await api(`/api/adult/search?q=${encodeURIComponent(q)}`);
  const items = d?.results || [];
  let html = `<div class="section"><h2 style="margin-bottom:16px">🔞 Results for "${q}"</h2>`;
  html += '<div class="grid">';
  items.forEach(m => { html += adultCardHTML(m); });
  html += '</div></div>';
  C.innerHTML = html;
}

function loadMyList() {
  let html = '<div class="section"><h2 style="margin-bottom:16px">My List</h2><div class="grid">';
  if (myList.length) {
    myList.forEach(m => { html += cardHTML(m); });
  } else {
    html += '<div style="padding:40px;color:var(--muted)">Your list is empty. Add movies by clicking + My List.</div>';
  }
  html += '</div></div>';
  document.getElementById('content').innerHTML = html;
}

// ── Cards ──
function cardHTML(m, extra = '') {
  return `<div class="card ${extra}" onclick="openDetail(${m.id},'${m.type || 'movie'}')">
    <div class="poster">
      ${m.poster ? `<img src="${m.poster}" alt="${m.title}" loading="lazy">` : '<div class="no-img">🎬</div>'}
      ${m.rating ? `<span class="rating-badge">★ ${m.rating}</span>` : ''}
      ${m.year ? `<span class="year-badge">${m.year}</span>` : ''}
    </div>
    <div class="card-title">${m.title}</div>
  </div>`;
}

function adultCardHTML(m) {
  return `<div class="card" onclick="playAdult('${m.source}','${m.url}','${m.title.replace(/'/g,"\\'")}')">
    <div class="poster">
      ${m.thumb ? `<img src="${m.thumb}" alt="${m.title}" loading="lazy">` : '<div class="no-img">🔞</div>'}
      ${m.duration ? `<span class="rating-badge">${m.duration}</span>` : ''}
    </div>
    <div class="card-title">${m.title}</div>
  </div>`;
}

function sectionHead(title) {
  return `<div class="section"><div class="section-head"><h2>${title}</h2></div>`;
}

// ── Detail Modal ──
async function openDetail(id, type) {
  document.getElementById('detailModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  const url = type === 'tv' ? `/api/tv/${id}` : `/api/movie/${id}`;
  const d = await api(url);
  if (!d) { closeModal(); return; }
  currentDetail = { ...d, id, type };

  document.getElementById('modalBg').style.backgroundImage = `url(${d.backdrop || d.poster || ''})`;
  document.getElementById('modalTitle').textContent = d.title;
  document.getElementById('modalMeta').innerHTML = `
    <span class="rating">★ ${d.rating || 'N/A'}</span>
    <span>${d.year || ''}</span>
    ${d.runtime ? `<span>${d.runtime}</span>` : ''}
    ${(d.genres || []).map(g => `<span style="color:var(--accent)">${g}</span>`).join(' ')}
  `;
  document.getElementById('modalBtns').innerHTML = `
    <button class="btn btn-primary" onclick="playMovie(${id},'${type}')">▶ Play</button>
    <button class="btn btn-secondary" onclick="addToList(${JSON.stringify({id,title:d.title,poster:d.poster,backdrop:d.backdrop,rating:d.rating,year:d.year,type}).replace(/"/g,'&quot;')})">+ My List</button>
    ${d.trailer ? `<button class="btn btn-secondary" onclick="window.open('${d.trailer.url}','_blank')">🎬 Trailer</button>` : ''}
  `;

  let body = '';
  if (d.synopsis) body += `<h3>Synopsis</h3><div class="synopsis">${d.synopsis}</div>`;
  if (d.cast?.length) {
    body += '<h3>Cast</h3><div class="cast-row">';
    d.cast.forEach(c => {
      body += `<div class="cast-card">${c.photo ? `<img src="${c.photo}" alt="${c.name}">` : '<div style="width:80px;height:80px;border-radius:50%;background:#333;margin-bottom:6px"></div>'}<div class="cast-name">${c.name}</div><div class="cast-char">${c.character}</div></div>`;
    });
    body += '</div>';
  }

  // TV seasons/episodes
  if (type === 'tv' && d.seasons?.length) {
    body += '<h3>Episodes</h3>';
    body += `<div class="season-sel"><select id="seasonSel" onchange="loadEpisodes(${id},this.value)">`;
    d.seasons.forEach(s => { body += `<option value="${s.number}">Season ${s.number} (${s.episodes} eps)</option>`; });
    body += '</select></div>';
    body += '<div class="ep-grid" id="epGrid"><div class="loading"><div class="spinner"></div></div></div>';
    setTimeout(() => loadEpisodes(id, d.seasons[0].number), 100);
  }

  if (d.similar?.length) {
    body += '<h3 style="margin-top:24px">Similar</h3><div class="row" style="margin-top:12px">';
    d.similar.forEach(m => { body += cardHTML(m); });
    body += '</div>';
  }

  document.getElementById('modalBody').innerHTML = body;
}

async function loadEpisodes(tvId, season) {
  const grid = document.getElementById('epGrid');
  if (!grid) return;
  grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const d = await api(`/api/tv/${tvId}/season/${season}`);
  if (!d?.episodes?.length) { grid.innerHTML = '<div style="padding:20px;color:var(--muted)">No episodes found</div>'; return; }
  grid.innerHTML = d.episodes.map(ep => `
    <div class="ep-card" onclick="playEpisode(${tvId},${season},${ep.number})">
      ${ep.thumb ? `<img class="ep-thumb" src="${ep.thumb}" alt="E${ep.number}">` : '<div class="ep-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--muted)">📺</div>'}
      <div class="ep-info">
        <div class="ep-num">E${ep.number}</div>
        <div class="ep-title">${ep.title || 'Episode ' + ep.number}</div>
      </div>
    </div>
  `).join('');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('open');
  document.body.style.overflow = '';
}

// ── Player ──
async function playMovie(id, type) {
  closeModal();
  const player = document.getElementById('playerOverlay');
  player.classList.add('open');
  document.getElementById('playerTitle').textContent = currentDetail?.title || '';
  document.getElementById('playerFrame').src = '';
  document.getElementById('playerSources').innerHTML = '<div class="loading" style="padding:10px"><div class="spinner"></div></div>';

  let sources = [];
  if (type === 'tv') {
    // For TV, try to get sources for first episode
    const d = await api(`/api/tv/${id}/1/1`);
    sources = d?.sources || [];
  } else {
    const d = await api(`/api/movie/${id}/sources`);
    sources = d?.sources || [];
  }

  currentSources = sources;
  renderSources(sources);

  // Auto-play first working source
  if (sources.length) {
    autoPlay(sources);
    saveContinueWatching(id, type);
  }
}

async function playEpisode(tvId, season, episode) {
  closeModal();
  const player = document.getElementById('playerOverlay');
  player.classList.add('open');
  document.getElementById('playerTitle').textContent = `${currentDetail?.title || ''} S${season} E${episode}`;
  document.getElementById('playerFrame').src = '';
  document.getElementById('playerSources').innerHTML = '<div class="loading" style="padding:10px"><div class="spinner"></div></div>';

  const d = await api(`/api/tv/${tvId}/${season}/${episode}`);
  const sources = d?.sources || [];
  currentSources = sources;
  renderSources(sources);
  if (sources.length) autoPlay(sources);
}

function playAdult(source, url, title) {
  const player = document.getElementById('playerOverlay');
  player.classList.add('open');
  document.getElementById('playerTitle').textContent = title;
  document.getElementById('playerSources').innerHTML = '';
  document.getElementById('srcSelect').innerHTML = '';
  document.getElementById('playerFrame').src = url;
}

function renderSources(sources) {
  const bar = document.getElementById('playerSources');
  const sel = document.getElementById('srcSelect');
  bar.innerHTML = '';
  sel.innerHTML = '';
  sources.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = `src-btn${i === 0 ? ' active' : ''}`;
    btn.textContent = `${s.name} ${s.quality || ''}`;
    btn.onclick = () => { document.querySelectorAll('.src-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); document.getElementById('playerFrame').src = s.url; };
    bar.appendChild(btn);
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = `${s.name} ${s.quality || ''}`;
    sel.appendChild(opt);
  });
}

function autoPlay(sources) {
  let idx = 0;
  function tryNext() {
    if (idx >= sources.length) { document.getElementById('playerSources').innerHTML += '<div style="padding:10px;color:var(--muted)">All sources failed</div>'; return; }
    document.getElementById('playerFrame').src = sources[idx].url;
    const btns = document.querySelectorAll('.src-btn');
    btns.forEach((b, i) => b.classList.toggle('active', i === idx));
    idx++;
  }
  tryNext();
}

function switchSrc(i) {
  if (currentSources[i]) {
    document.getElementById('playerFrame').src = currentSources[i].url;
    document.querySelectorAll('.src-btn').forEach((b, j) => b.classList.toggle('active', j === +i));
  }
}

function closePlayer() {
  document.getElementById('playerOverlay').classList.remove('open');
  document.getElementById('playerFrame').src = '';
}

// ── Hero carousel ──
let heroIdx = 0;
let heroTimer;
function startHero() {
  const slides = document.querySelectorAll('.hero-slide');
  if (slides.length < 2) return;
  heroTimer = setInterval(() => {
    slides[heroIdx].classList.remove('active');
    document.querySelectorAll('.hero-dot')[heroIdx]?.classList.remove('active');
    heroIdx = (heroIdx + 1) % slides.length;
    slides[heroIdx].classList.add('active');
    document.querySelectorAll('.hero-dot')[heroIdx]?.classList.add('active');
  }, 5000);
}

function goSlide(i) {
  clearInterval(heroTimer);
  const slides = document.querySelectorAll('.hero-slide');
  slides[heroIdx]?.classList.remove('active');
  document.querySelectorAll('.hero-dot')[heroIdx]?.classList.remove('active');
  heroIdx = i;
  slides[heroIdx]?.classList.add('active');
  document.querySelectorAll('.hero-dot')[heroIdx]?.classList.add('active');
  startHero();
}

// ── My List ──
function addToList(m) {
  if (!myList.find(x => x.id === m.id)) {
    myList.push(m);
    localStorage.setItem('mylist', JSON.stringify(myList));
    toast('Added to My List ✓');
  } else {
    toast('Already in your list');
  }
}

// ── Continue Watching ──
function getContinueWatching() {
  try { return JSON.parse(localStorage.getItem('cw') || '[]'); } catch { return []; }
}

function saveContinueWatching(id, type) {
  let cw = getContinueWatching();
  cw = cw.filter(x => x.id !== id);
  cw.unshift({ id, type, title: currentDetail?.title, poster: currentDetail?.poster, rating: currentDetail?.rating, year: currentDetail?.year, ts: Date.now() });
  if (cw.length > 20) cw = cw.slice(0, 20);
  localStorage.setItem('cw', JSON.stringify(cw));
}

// ── Age gate ──
function showAgeGate() { document.getElementById('ageGate').style.display = 'flex'; }
function verifyAge() { ageVerified = true; localStorage.setItem('age_ok', '1'); document.getElementById('ageGate').style.display = 'none'; setActiveTab('adult'); loadAdult(); }
function denyAge() { document.getElementById('ageGate').style.display = 'none'; setActiveTab('home'); loadTab('home'); }

// ── Toast ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Theme ──
function toggleTheme() {
  document.body.classList.toggle('light');
  toast('Theme toggled');
}
</script>
