<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MovieBox</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg2: #12151d;
    --bg3: #1a1e28;
    --text: #f1f3f8;
    --muted: #8d94a3;
    --accent: #e50914;
    --accent2: #ff2f3c;
    --gold: #ffb300;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; }
  button { cursor: pointer; font-family: inherit; }

  /* ── Header ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(11,13,18,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #1f2430;
    padding: 14px 24px;
    display: flex; align-items: center; gap: 20px;
    flex-wrap: wrap;
  }
  .logo {
    font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
  }
  .logo .film { color: var(--accent); }
  nav {
    display: flex; gap: 4px; flex: 1;
    overflow-x: auto; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  .nav-btn {
    background: transparent; border: 0; color: var(--muted);
    padding: 8px 16px; border-radius: 20px; font-size: 14px;
    font-weight: 600; white-space: nowrap; transition: all .15s;
  }
  .nav-btn:hover { color: var(--text); background: var(--bg3); }
  .nav-btn.active { background: var(--accent); color: #fff; }
  .nav-btn.adult { color: var(--gold); }
  .nav-btn.adult.active { background: var(--gold); color: #111; }

  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg2); border: 1px solid #262b37;
    padding: 8px 14px; border-radius: 22px;
    min-width: 220px; max-width: 320px; flex: 0 1 320px;
  }
  .search-box input {
    background: transparent; border: 0; outline: none;
    color: var(--text); font-size: 14px; flex: 1;
    min-width: 80px;
  }
  .search-box .icon { color: var(--muted); font-size: 15px; }

  /* ── Main Layout ── */
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .section-title {
    font-size: 20px; font-weight: 700;
    margin: 28px 0 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title .dot { width: 6px; height: 22px; background: var(--accent); border-radius: 3px; }

  /* ── Category Pills ── */
  .pills {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px;
    scrollbar-width: none;
  }
  .pills::-webkit-scrollbar { display: none; }
  .pill {
    background: var(--bg3); border: 1px solid #262b37; color: var(--text);
    padding: 8px 16px; border-radius: 20px; font-size: 13px;
    font-weight: 600; white-space: nowrap; transition: all .15s;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent2); }
  .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pill.adult.active { background: var(--gold); color: #111; border-color: var(--gold); }

  /* ── Movie Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--bg2); border-radius: var(--radius);
    overflow: hidden; cursor: pointer; transition: all .18s;
    border: 1px solid #1c2029;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); }
  .card .poster {
    width: 100%; aspect-ratio: 2/3;
    object-fit: cover; background: var(--bg3);
  }
  .card.adult .poster { aspect-ratio: 16/10; }
  .card .info { padding: 10px 12px; }
  .card .title {
    font-size: 13px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; color: var(--muted); font-size: 11px;
  }
  .card .rating { color: var(--gold); font-weight: 700; }
  .card .dur {
    background: rgba(0,0,0,0.75); color: #fff;
    padding: 2px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 700;
  }
  .card .play-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.5); display: flex;
    align-items: center; justify-content: center;
    opacity: 0; transition: opacity .18s;
  }
  .card .play-overlay span {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); display: flex;
    align-items: center; justify-content: center;
    font-size: 22px; color: #fff;
  }
  .card .poster-wrap { position: relative; }
  .card:hover .play-overlay { opacity: 1; }

  /* ── Skeletons ── */
  .skeleton {
    background: linear-gradient(90deg, var(--bg2), var(--bg3), var(--bg2));
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .sk-poster { width: 100%; aspect-ratio: 2/3; border-radius: var(--radius); }
  .sk-line { height: 12px; border-radius: 4px; margin-top: 10px; }

  /* ── Status Messages ── */
  .status {
    text-align: center; padding: 60px 20px;
    color: var(--muted); font-size: 15px;
  }
  .status.error {
    color: var(--accent2);
    background: rgba(229,9,20,0.08);
    border: 1px solid rgba(229,9,20,0.25);
    border-radius: 12px;
    margin: 20px 0;
    word-break: break-word;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    text-align: left;
  }
  .status .big { font-size: 42px; margin-bottom: 12px; }

  /* ── Modal ── */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    padding: 20px; overflow-y: auto;
    backdrop-filter: blur(8px);
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg2); border-radius: 14px;
    width: 100%; max-width: 980px; max-height: 92vh;
    overflow-y: auto; border: 1px solid #262b37;
  }
  .modal-head {
    display: flex; justify-content: space-between;
    align-items: flex-start; padding: 18px 22px;
    border-bottom: 1px solid #1c2029;
  }
  .modal-head h2 { font-size: 22px; font-weight: 700; }
  .modal-head .sub {
    color: var(--muted); font-size: 13px; margin-top: 6px;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .close-btn {
    background: var(--bg3); border: 0; color: var(--text);
    width: 36px; height: 36px; border-radius: 50%;
    font-size: 20px; line-height: 1;
  }
  .close-btn:hover { background: var(--accent); }
  .modal-body { padding: 22px; }
  .player-wrap {
    width: 100%; aspect-ratio: 16/9;
    background: #000; border-radius: 8px;
    overflow: hidden; margin-bottom: 18px;
  }
  .player-wrap video, .player-wrap iframe {
    width: 100%; height: 100%; border: 0; display: block;
  }
  .sources {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 10px 0; scrollbar-width: none; flex-wrap: wrap;
  }
  .sources::-webkit-scrollbar { display: none; }
  .src-btn {
    background: var(--bg3); border: 1px solid #262b37;
    color: var(--text); padding: 8px 14px; border-radius: 8px;
    font-size: 12px; font-weight: 600;
  }
  .src-btn:hover, .src-btn.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .synopsis {
    color: var(--muted); font-size: 14px; line-height: 1.65;
    margin: 14px 0;
  }
  .genres { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .genre-tag {
    background: var(--bg3); color: var(--text);
    padding: 5px 12px; border-radius: 14px; font-size: 12px;
    border: 1px solid #262b37;
  }

  /* ── Episode Selector ── */
  .ep-selector {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin: 14px 0; align-items: center;
  }
  .ep-selector select {
    background: var(--bg3); color: var(--text);
    border: 1px solid #262b37; border-radius: 6px;
    padding: 8px 12px; font-size: 13px; font-family: inherit;
    outline: none; cursor: pointer;
  }
  .ep-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px; margin-top: 12px; max-height: 220px; overflow-y: auto;
  }
  .ep-btn {
    background: var(--bg3); border: 1px solid #262b37;
    color: var(--text); padding: 10px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
  }
  .ep-btn:hover, .ep-btn.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }

  /* ── Age Gate ── */
  .age-gate {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(11,13,18,0.97);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; padding: 20px; text-align: center;
    backdrop-filter: blur(14px);
  }
  .age-gate.open { display: flex; }
  .age-gate .warn { font-size: 72px; margin-bottom: 18px; }
  .age-gate h2 { font-size: 30px; margin-bottom: 10px; }
  .age-gate p { color: var(--muted); font-size: 15px; max-width: 520px; line-height: 1.6; margin-bottom: 28px; }
  .age-gate .actions { display: flex; gap: 14px; }
  .btn-yes, .btn-no {
    padding: 14px 32px; border-radius: 28px;
    font-size: 15px; font-weight: 700; border: 0;
  }
  .btn-yes { background: var(--gold); color: #111; }
  .btn-yes:hover { filter: brightness(1.1); }
  .btn-no { background: var(--bg3); color: var(--text); }
  .btn-no:hover { background: var(--accent); color: #fff; }

  /* ── Footer ── */
  footer {
    padding: 36px 24px; margin-top: 50px;
    border-top: 1px solid #1c2029;
    color: var(--muted); text-align: center; font-size: 13px;
  }

  /* ── Responsive ── */
  @media (max-width: 720px) {
    header { padding: 12px 14px; gap: 12px; }
    .logo { font-size: 18px; }
    .search-box { order: 3; flex: 1 1 100%; max-width: 100%; }
    main { padding: 16px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .modal-head h2 { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────── -->
<header>
  <div class="logo" onclick="goHome()">
    <span class="film">🎬</span> MovieBox
  </div>
  <nav>
    <button class="nav-btn active" data-tab="home" onclick="switchTab('home')">Home</button>
    <button class="nav-btn" data-tab="movies" onclick="switchTab('movies')">Movies</button>
    <button class="nav-btn" data-tab="tv" onclick="switchTab('tv')">TV Shows</button>
    <button class="nav-btn adult" data-tab="adult" onclick="switchTab('adult')">🔞 18+</button>
  </nav>
  <div class="search-box">
    <span class="icon">🔍</span>
    <input id="searchInput" type="text" placeholder="Search..." onkeydown="if(event.key==='Enter') doSearch()">
  </div>
</header>

<!-- ── Main ─────────────────────────────────────────────── -->
<main id="main">
  <div id="content"></div>
</main>

<footer>
  <div>🎬 MovieBox · Built with 🍕 + Node.js · Content sourced from public APIs &amp; aggregators</div>
</footer>

<!-- ── Detail Modal ────────────────────────────────────── -->
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="modalTitle">—</h2>
        <div class="sub" id="modalSub"></div>
      </div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="player-wrap" id="playerWrap"></div>
      <div class="sources" id="sourcesRow"></div>
      <div class="ep-selector" id="epSelector"></div>
      <div class="ep-list" id="epList"></div>
      <div class="genres" id="modalGenres"></div>
      <p class="synopsis" id="modalSynopsis"></p>
    </div>
  </div>
</div>

<!-- ── Age Gate ────────────────────────────────────────── -->
<div class="age-gate" id="ageGate">
  <div class="warn">🔞</div>
  <h2>Are you 18 or older?</h2>
  <p>This section contains adult content. By entering you confirm you are of legal age to view explicit material in your jurisdiction.</p>
  <div class="actions">
    <button class="btn-yes" onclick="enterAdult()">Yes, I'm 18+</button>
    <button class="btn-no" onclick="leaveAdult()">No, take me back</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════
let currentTab = 'home';
let currentGenre = null;
let currentAdultCat = null;
let adultUnlocked = localStorage.getItem('mbx_age_ok') === '1';

// ═══════════════════════════════════════════════════════════
//  Fetch helpers — EVERY URL matched to live server.js
// ═══════════════════════════════════════════════════════════
async function api(url) {
  try {
    const r = await fetch(url);
    const ct = r.headers.get('content-type') || '';
    if (!ct.includes('application/json')) {
      throw new Error(`${url} returned non-JSON (likely HTML fallback). Status ${r.status}.`);
    }
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status} on ${url}`);
    return data;
  } catch (e) {
    throw new Error(`GET ${url} → ${e.message}`);
  }
}

function gridHTML(items, adultMode = false) {
  if (!Array.isArray(items) || items.length === 0) {
    return `<div class="status"><div class="big">🤷</div>No results found.</div>`;
  }
  return `<div class="grid">${items.map(it => {
    const poster = it.poster || it.thumbnail || it.image || 'https://placehold.co/300x450/12151d/8d94a3?text=No+Poster';
    const title = (it.title || it.name || 'Untitled').replace(/"/g, '&quot;');
    const meta = it.year || it.duration || it.date || '';
    const rating = it.rating || it.score || '';
    return `
      <div class="card ${adultMode ? 'adult' : ''}" onclick='openDetail(${JSON.stringify({
        id: it.id, title: it.title || it.name, source: it.source || null,
        adult: adultMode ? 1 : 0, poster
      }).replace(/'/g, "&#39;")})'>
        <div class="poster-wrap">
          <img class="poster" src="${poster}" alt="${title}" loading="lazy"
               onerror="this.src='https://placehold.co/300x450/12151d/8d94a3?text=No+Poster'">
          <div class="play-overlay"><span>▶</span></div>
        </div>
        <div class="info">
          <div class="title" title="${title}">${title}</div>
          <div class="meta">
            <span>${meta}</span>
            ${rating ? `<span class="rating">★ ${rating}</span>` : ''}
          </div>
        </div>
      </div>`;
  }).join('')}</div>`;
}

function skeletonHTML(n = 12) {
  return `<div class="grid">${Array.from({length: n}, () => `
    <div><div class="sk-poster skeleton"></div><div class="sk-line skeleton"></div><div class="sk-line skeleton" style="width:60%"></div></div>
  `).join('')}</div>`;
}

function errorHTML(msg) {
  return `<div class="status error"><strong>⚠️ Failed to load</strong><br><br>${msg}</div>`;
}

// ═══════════════════════════════════════════════════════════
//  Tabs
// ═══════════════════════════════════════════════════════════
function switchTab(tab) {
  if (tab === 'adult' && !adultUnlocked) {
    document.getElementById('ageGate').classList.add('open');
    return;
  }
  currentTab = tab;
  currentGenre = null;
  currentAdultCat = null;
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  render();
}

function goHome() {
  document.getElementById('searchInput').value = '';
  switchTab('home');
}

async function render() {
  const el = document.getElementById('content');
  el.innerHTML = skeletonHTML(12);
  try {
    if (currentTab === 'home' || currentTab === 'movies') {
      await renderMovies(el);
    } else if (currentTab === 'tv') {
      await renderTV(el);
    } else if (currentTab === 'adult') {
      await renderAdult(el);
    }
  } catch (e) {
    el.innerHTML = errorHTML(e.message);
  }
}

// ═══════════════════════════════════════════════════════════
//  MOVIES  — endpoints: /api/movies/*
// ═══════════════════════════════════════════════════════════
const MOVIE_GENRES = [
  ['all','All'], ['action','Action'], ['comedy','Comedy'], ['horror','Horror'],
  ['romance','Romance'], ['sci-fi','Sci-Fi'], ['thriller','Thriller'], ['drama','Drama'],
  ['animation','Animation'], ['fantasy','Fantasy'], ['adventure','Adventure'], ['crime','Crime']
];

async function renderMovies(el) {
  const pillsHTML = `<div class="pills">${MOVIE_GENRES.map(([k, label]) => `
    <button class="pill ${currentGenre === k ? 'active' : ''}"
            onclick="selectMovieGenre('${k}')">${label}</button>
  `).join('')}</div>`;

  let data;
  if (currentGenre && currentGenre !== 'all') {
    // /api/movies/genre/:name
    data = await api(`/api/movies/genre/${encodeURIComponent(currentGenre)}`);
    el.innerHTML = `<div class="section-title"><div class="dot"></div>Genre · ${currentGenre.toUpperCase()}</div>${pillsHTML}`;
    el.insertAdjacentHTML('beforeend', gridHTML(data.results || []));
  } else {
    // /api/movies/trending
    data = await api('/api/movies/trending');
    el.innerHTML = `<div class="section-title"><div class="dot"></div>Trending Now</div>${pillsHTML}`;
    el.insertAdjacentHTML('beforeend', gridHTML(data.results || []));
  }
}

function selectMovieGenre(genre) {
  currentGenre = currentGenre === genre ? null : genre;
  render();
}

// ═══════════════════════════════════════════════════════════
//  TV  — endpoints: /api/tv/*
// ═══════════════════════════════════════════════════════════
async function renderTV(el) {
  // /api/tv/trending
  const data = await api('/api/tv/trending');
  el.innerHTML = `<div class="section-title"><div class="dot"></div>Popular TV Shows</div>`;
  el.insertAdjacentHTML('beforeend', gridHTML(data.results || []));
}

// ═══════════════════════════════════════════════════════════
//  ADULT  — endpoints: /api/adult/*
// ═══════════════════════════════════════════════════════════
const ADULT_CATS = [
  ['all','🔥 Trending'], ['trending','🔥 Trending'], ['popular','⭐ Popular'], ['new','🆕 New'],
  ['amateur','Amateur'], ['anal','Anal'], ['asian','Asian'], ['bbw','BBW'],
  ['big-tits','Big Tits'], ['blonde','Blonde'], ['blowjob','Blowjob'], ['brunette','Brunette'],
  ['ebony','Ebony'], ['latina','Latina'], ['lesbian','Lesbian'], ['mature','Mature'],
  ['milf','MILF'], ['teen','Teen'], ['threesome','Threesome'], ['toys','Toys']
];

async function renderAdult(el) {
  const pillsHTML = `<div class="pills">${ADULT_CATS.map(([k, label]) => `
    <button class="pill adult ${currentAdultCat === k ? 'active' : ''}"
            onclick="selectAdultCat('${k}')">${label}</button>
  `).join('')}</div>`;

  let data;
  if (currentAdultCat && currentAdultCat !== 'all' && currentAdultCat !== 'trending') {
    // /api/adult/category/:name
    data = await api(`/api/adult/category/${encodeURIComponent(currentAdultCat)}`);
    el.innerHTML = `<div class="section-title"><div class="dot"></div>🔞 ${currentAdultCat.toUpperCase()}</div>${pillsHTML}`;
    el.insertAdjacentHTML('beforeend', gridHTML(data.results || [], true));
  } else {
    // /api/adult/trending
    data = await api('/api/adult/trending');
    el.innerHTML = `<div class="section-title"><div class="dot"></div>🔞 Trending Now</div>${pillsHTML}`;
    el.insertAdjacentHTML('beforeend', gridHTML(data.results || [], true));
  }
}

function selectAdultCat(cat) {
  currentAdultCat = (currentAdultCat === cat) ? 'trending' : cat;
  render();
}

// ═══════════════════════════════════════════════════════════
//  SEARCH — /api/movies/search, /api/adult/search
// ═══════════════════════════════════════════════════════════
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return render();
  const el = document.getElementById('content');
  el.innerHTML = skeletonHTML(12);
  try {
    if (currentTab === 'adult') {
      // /api/adult/search?q=
      const data = await api(`/api/adult/search?q=${encodeURIComponent(q)}`);
      el.innerHTML = `<div class="section-title"><div class="dot"></div>Results for "${q}"</div>`;
      el.insertAdjacentHTML('beforeend', gridHTML(data.results || [], true));
    } else if (currentTab === 'tv') {
      // /api/movies/search is the movie one; TV search via /api/tv/trending only,
      // so fallback to movie search across content
      const data = await api(`/api/movies/search?q=${encodeURIComponent(q)}`);
      el.innerHTML = `<div class="section-title"><div class="dot"></div>Results for "${q}"</div>`;
      el.insertAdjacentHTML('beforeend', gridHTML(data.results || []));
    } else {
      // /api/movies/search?q=
      const data = await api(`/api/movies/search?q=${encodeURIComponent(q)}`);
      el.innerHTML = `<div class="section-title"><div class="dot"></div>Results for "${q}"</div>`;
      el.insertAdjacentHTML('beforeend', gridHTML(data.results || []));
    }
  } catch (e) {
    el.innerHTML = errorHTML(e.message);
  }
}

// ═══════════════════════════════════════════════════════════
//  DETAIL MODAL
// ═══════════════════════════════════════════════════════════
async function openDetail(item) {
  const modal = document.getElementById('modalBackdrop');
  modal.classList.add('open');
  document.getElementById('modalTitle').textContent = item.title || 'Untitled';
  document.getElementById('modalSub').innerHTML = 'Loading…';
  document.getElementById('playerWrap').innerHTML = '';
  document.getElementById('sourcesRow').innerHTML = '';
  document.getElementById('epSelector').innerHTML = '';
  document.getElementById('epList').innerHTML = '';
  document.getElementById('modalGenres').innerHTML = '';
  document.getElementById('modalSynopsis').textContent = '';

  try {
    if (item.adult && item.source) {
      // /api/adult/video/:source/:id
      const data = await api(`/api/adult/video/${encodeURIComponent(item.source)}/${encodeURIComponent(item.id)}`);
      renderAdultDetail(data, item);
    } else if (item.adult) {
      const data = await api(`/api/adult/video/xvideos/${encodeURIComponent(item.id)}`);
      renderAdultDetail(data, item);
    } else {
      // Try movie first: /api/movie/:id
      try {
        const data = await api(`/api/movie/${encodeURIComponent(item.id)}`);
        renderMovieDetail(data, item);
      } catch (e) {
        // Fallback to TV: /api/tv/:id
        const data = await api(`/api/tv/${encodeURIComponent(item.id)}`);
        renderTVDetail(data, item);
      }
    }
  } catch (e) {
    document.getElementById('modalSub').innerHTML = `<span style="color:var(--accent2)">${e.message}</span>`;
  }
}

function renderMovieDetail(d, item) {
  document.getElementById('modalTitle').textContent = d.title || item.title || 'Untitled';
  const sub = [
    d.year ? `📅 ${d.year}` : '',
    d.rating ? `★ ${d.rating}` : '',
    d.runtime ? `⏱ ${d.runtime}` : ''
  ].filter(Boolean).join(' · ');
  document.getElementById('modalSub').innerHTML = sub;
  document.getElementById('modalSynopsis').textContent = d.synopsis || d.overview || 'No synopsis available.';
  const genres = d.genres || [];
  document.getElementById('modalGenres').innerHTML = genres.map(g => `<span class="genre-tag">${g}</span>`).join('');

  // Load stream sources: /api/movie/:id/sources
  api(`/api/movie/${encodeURIComponent(item.id)}/sources`)
    .then(s => renderSources(s.sources || s.results || [], d.title || item.title))
    .catch(e => {
      document.getElementById('sourcesRow').innerHTML =
        `<div class="status error" style="margin:0;padding:12px">${e.message}</div>`;
    });
}

function renderTVDetail(d, item) {
  document.getElementById('modalTitle').textContent = d.title || item.title || 'Untitled';
  document.getElementById('modalSub').innerHTML = d.year ? `📅 ${d.year} · TV Series` : 'TV Series';
  document.getElementById('modalSynopsis').textContent = d.synopsis || d.overview || 'No synopsis available.';
  const genres = d.genres || [];
  document.getElementById('modalGenres').innerHTML = genres.map(g => `<span class="genre-tag">${g}</span>`).join('');

  const seasons = d.seasons || [];
  if (seasons.length > 0) {
    const selHTML = `
      <select id="seasonSel" onchange="onSeasonChange('${item.id}')">
        ${seasons.map(s => `<option value="${s}">Season ${s}</option>`).join('')}
      </select>`;
    document.getElementById('epSelector').innerHTML = selHTML;
    onSeasonChange(item.id);
  }
}

async function onSeasonChange(id) {
  const season = document.getElementById('seasonSel')?.value || 1;
  const list = document.getElementById('epList');
  list.innerHTML = `<div class="status" style="grid-column:1/-1">Loading episodes…</div>`;
  try {
    // /api/tv/:id/:season/:episode — pull episode 1 first to reveal list
    const data = await api(`/api/tv/${encodeURIComponent(id)}/${encodeURIComponent(season)}/1`);
    const eps = data.episodes || [];
    if (eps.length === 0) {
      list.innerHTML = `<div class="status" style="grid-column:1/-1">No episodes found.</div>`;
    } else {
      list.innerHTML = eps.map(n => `
        <button class="ep-btn" onclick="playEpisode('${id}','${season}','${n}')">E${n}</button>
      `).join('');
      playEpisode(id, season, eps[0]);
    }
  } catch (e) {
    list.innerHTML = `<div class="status error" style="grid-column:1/-1">${e.message}</div>`;
  }
}

async function playEpisode(id, season, episode) {
  document.getElementById('epList').querySelectorAll('.ep-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim() === `E${episode}`);
  });
  try {
    const data = await api(`/api/tv/${encodeURIComponent(id)}/${encodeURIComponent(season)}/${encodeURIComponent(episode)}`);
    renderSources(data.sources || (data.url ? [{name:'Primary', url: data.url}] : []), `S${season}E${episode}`);
  } catch (e) {
    document.getElementById('sourcesRow').innerHTML =
      `<div class="status error" style="margin:0;padding:12px">${e.message}</div>`;
  }
}

function renderAdultDetail(d, item) {
  document.getElementById('modalTitle').textContent = d.title || item.title || 'Adult Video';
  const sub = [
    d.duration ? `⏱ ${d.duration}` : '',
    d.views ? `👁 ${d.views}` : '',
    d.source ? `source: ${d.source}` : ''
  ].filter(Boolean).join(' · ');
  document.getElementById('modalSub').innerHTML = sub;
  document.getElementById('modalSynopsis').textContent = d.description || '';
  renderSources(d.sources || (d.url ? [{name: 'Primary', url: d.url}] : []), d.title);
}

function renderSources(sources, title) {
  const row = document.getElementById('sourcesRow');
  const wrap = document.getElementById('playerWrap');
  if (!Array.isArray(sources) || sources.length === 0) {
    row.innerHTML = `<div class="status" style="padding:8px">No stream sources available.</div>`;
    return;
  }
  row.innerHTML = sources.map((s, i) => `
    <button class="src-btn ${i === 0 ? 'active' : ''}"
            onclick="playSource('${encodeURIComponent(s.url)}', this)">${s.name || `Source ${i+1}`}</button>
  `).join('');
  playSource(encodeURIComponent(sources[0].url), null);
}

function playSource(encodedUrl, btn) {
  if (btn) {
    document.querySelectorAll('.src-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  const url = decodeURIComponent(encodedUrl);
  const wrap = document.getElementById('playerWrap');
  if (/\.(mp4|m3u8|webm)(\?|$)/i.test(url)) {
    wrap.innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
  } else {
    wrap.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
  }
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
  document.getElementById('playerWrap').innerHTML = '';
}

// ═══════════════════════════════════════════════════════════
//  Age gate
// ═══════════════════════════════════════════════════════════
function enterAdult() {
  adultUnlocked = true;
  localStorage.setItem('mbx_age_ok', '1');
  document.getElementById('ageGate').classList.remove('open');
  currentTab = 'adult';
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === 'adult');
  });
  render();
}

function leaveAdult() {
  document.getElementById('ageGate').classList.remove('open');
  goHome();
}

// ═══════════════════════════════════════════════════════════
//  Boot
// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
render();
</script>
