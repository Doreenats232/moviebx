<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MovieBox</title>
<style>
:root{--bg:#0b0d12;--bg2:#12151d;--bg3:#1a1e28;--text:#f1f3f8;--muted:#8d94a3;--accent:#e50914;--accent2:#ff2f3c;--gold:#ffb300;--border:#262b37;--green:#22c55e}
[data-theme="light"]{--bg:#f4f5f8;--bg2:#fff;--bg3:#e9ebf0;--text:#12151d;--muted:#5c6474;--border:#d8dce4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{cursor:pointer;font-family:inherit}
input,select{font-family:inherit}
header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;cursor:pointer;white-space:nowrap}
.logo .film{color:var(--accent)}
nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nav-btn{background:transparent;border:0;color:var(--muted);padding:8px 14px;border-radius:20px;font-size:13.5px;font-weight:600;white-space:nowrap}
.nav-btn:hover{color:var(--text);background:var(--bg3)}
.nav-btn.active{background:var(--accent);color:#fff}
.nav-btn.adult{color:var(--gold)}
.nav-btn.adult.active{background:var(--gold);color:#111}
.search-\boxed{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);padding:8px 13px;border-radius:22px;flex:0 1 240px;min-width:170px}
.search-box input{background:transparent;border:0;outline:none;color:var(--text);font-size:13.5px;flex:1;min-width:50px}
.icon-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:15px}
.icon-btn:hover{background:var(--bg3)}
.rd-badge{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:var(--green);padding:6px 11px;border-radius:18px;font-size:11px;font-weight:700;white-space:nowrap}
.rd-badge.off{background:rgba(141,148,163,.12);border-color:var(--border);color:var(--muted)}
main{padding:20px;max-width:1440px;margin:0 auto}
.section-title{font-size:18px;font-weight:700;margin:24px 0 13px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.section-title .dot{width:5px;height:20px;background:var(--accent);border-radius:3px}
.section-title .sub{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:auto}
.hero{position:relative;border-radius:14px;overflow:hidden;height:380px;background:var(--bg3);margin-bottom:8px}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .7s;background-size:cover;background-position:center}
.hero-slide.active{opacity:1}
.hero-slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,13,18,.95) 0%,rgba(11,13,18,.55) 55%,rgba(11,13,18,.1) 100%)}
.hero-info{position:absolute;left:0;bottom:0;z-index:2;padding:30px;max-width:600px}
.hero-info h1{font-size:33px;line-height:1.15;margin-bottom:10px}
.hero-info p{color:#cfd4de;font-size:13.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-meta{display:flex;gap:11px;align-items:center;margin-bottom:11px;font-size:12.5px;color:#cfd4de;flex-wrap:wrap}
.hero-actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.hero-dots{position:absolute;right:20px;bottom:20px;z-index:3;display:flex;gap:6px}
.hero-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
.hero-dots span.on{background:var(--accent);width:22px;border-radius:4px}
.btn{padding:10px 20px;border-radius:22px;font-size:13.5px;font-weight:700;border:0;display:inline-flex;gap:7px;align-items:center}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-gold{background:var(--gold);color:#111}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28)}
.btn-ghost:hover{background:rgba(255,255,255,.24)}
.row{display:flex;gap:13px;overflow-x:auto;padding:5px 2px 14px;scrollbar-width:thin}
.row::-webkit-scrollbar{height:6px}
.row::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.row .card{flex:0 0 165px}
.rank{position:absolute;left:-5px;top:-5px;z-index:2;font-size:60px;font-weight:900;color:var(--text);-webkit-text-stroke:3px var(--accent);text-shadow:0 4px 16px rgba(0,0,0,.6);line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px}
.card{background:var(--bg2);border-radius:10px;overflow:hidden;cursor:pointer;transition:.18s;border:1px solid var(--border);position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.poster-wrap{position:relative}
.card .poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--bg3);display:block}
.card.adult .poster{aspect-ratio:16/10}
.play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:.18s}
.play-overlay span{width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.card:hover .play-overlay{opacity:1}
.badge{position:absolute;bottom:7px;left:7px;display:flex;gap:5px;flex-wrap:wrap;z-index:2}
.badge b{background:rgba(0,0,0,.78);color:#fff;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700}
.badge b.gold{background:var(--gold);color:#111}
.card .info{padding:9px 11px}
.card .title{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:5px;color:var(--muted);font-size:10.5px;gap:7px}
.card .rating{color:var(--gold);font-weight:700}
.fav-btn{position:absolute;top:7px;right:7px;z-index:3;background:rgba(0,0,0,.65);border:0;color:#fff;width:30px;height:30px;border-radius:50%;font-size:14px;opacity:0;transition:.15s}
.card:hover .fav-btn{opacity:1}
.fav-btn.on{opacity:1;color:var(--gold)}
.progress{height:4px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pills{display:flex;gap:7px;overflow-x:auto;padding:4px 0 11px;scrollbar-width:none;flex-wrap:wrap}
.pills::-webkit-scrollbar{display:none}
.pill{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:18px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill:hover{border-color:var(--accent);color:var(--accent2)}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.adult.active{background:var(--gold);color:#111;border-color:var(--gold)}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px;margin-top:11px;max-height:330px;overflow-y:auto;padding-right:3px}
.ep-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;display:flex;gap:9px;padding:7px;transition:.15s}
.ep-card:hover,.ep-card.active{border-color:var(--accent)}
.ep-card img{width:82px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;background:var(--bg2);flex-shrink:0}
.ep-card .ep-t{font-size:11.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-card .ep-d{font-size:10px;color:var(--muted);margin-top:3px}
.modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:none;align-items:flex-start;justify-content:center;padding:18px;overflow-y:auto;backdrop-filter:blur(8px)}
.modal-backdrop.open{display:flex}
.modal{background:var(--bg2);border-radius:13px;width:100%;max-width:980px;border:1px solid var(--border);overflow:hidden}
.modal-hero{height:220px;background-size:cover;background-position:center;position:relative;background-color:var(--bg3)}
.modal-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),var(--bg2))}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:15px 20px 0;position:relative;z-index:2;margin-top:-42px}
.modal-head h2{font-size:22px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.85)}
.modal-sub{color:var(--muted);font-size:12.5px;margin-top:7px;display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.close-btn{background:rgba(0,0,0,.6);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;position:absolute;top:13px;right:13px;z-index:5}
.close-btn:hover{background:var(--accent)}
.modal-body{padding:16px 20px 24px}
.player-wrap{width:100%;aspect-ratio:16/9;background:#000;border-radius:9px;overflow:hidden;position:relative}
.player-wrap video,.player-wrap iframe{width:100%;height:100%;border:0;display:block}
.player-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,#0d1017,#161a24);color:var(--muted);text-align:center;padding:20px}
.player-placeholder .big-play{width:76px;height:76px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;box-shadow:0 8px 30px rgba(229,9,20,.4)}
.player-placeholder .big-play:hover{transform:scale(1.05)}
.player-placeholder .msg{font-size:13.5px;max-width:420px;line-height:1.55}
.player-placeholder .msg strong{color:var(--text)}
.player-placeholder .err{color:var(--accent2);background:rgba(229,9,20,.1);border:1px solid rgba(229,9,20,.3);padding:9px 13px;border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;max-width:560px;word-break:break-word}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.src-status{position:absolute;left:11px;top:11px;z-index:7;background:rgba(0,0,0,.72);color:#fff;padding:6px 11px;border-radius:8px;font-size:11.5px;font-weight:600}
.pip-btn{position:absolute;right:11px;bottom:11px;z-index:4;background:rgba(0,0,0,.7);border:0;color:#fff;padding:7px 12px;border-radius:8px;font-size:11.5px;font-weight:700}
.next-overlay{position:absolute;inset:0;background:rgba(11,13,18,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:13px;z-index:6;text-align:center;padding:18px}
.next-overlay.show{display:flex}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0}
.sources{display:flex;gap:7px;overflow-x:auto;padding:11px 0;flex-wrap:wrap}
.src-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 13px;border-radius:8px;font-size:11.5px;font-weight:600}
.src-btn:hover,.src-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.src-btn.auto{background:var(--gold);color:#111;border-color:var(--gold)}
.src-btn.auto.off{background:var(--bg3);color:var(--text);border-color:var(--border)}
.genres{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}
.genre-tag{background:var(--bg3);color:var(--text);padding:4px 11px;border-radius:13px;font-size:11.5px;border:1px solid var(--border)}
.synopsis{color:var(--muted);font-size:13.5px;line-height:1.65;margin:10px 0}
.skeleton{background:linear-gradient(90deg,var(--bg2),var(--bg3),var(--bg2));background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-poster{width:100%;aspect-ratio:2/3;border-radius:10px}
.sk-line{height:11px;border-radius:4px;margin-top:9px}
.status{text-align:center;padding:50px 18px;color:var(--muted);font-size:14px}
.status.error{color:var(--accent2);background:rgba(229,9,20,.08);border:1px solid rgba(229,9,20,.25);border-radius:11px;margin:15px 0;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;text-align:left;padding:14px}
.retry{margin-top:12px}
.age-gate{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center;backdrop-filter:blur(14px)}
.age-gate.open{display:flex}
.age-gate .warn{font-size:64px;margin-bottom:14px}
.age-gate h2{font-size:27px;margin-bottom:9px}
.age-gate p{color:var(--muted);font-size:14px;max-width:500px;line-height:1.6;margin-bottom:24px}
.age-gate .actions{display:flex;gap:13px;flex-wrap:wrap;justify-content:center}
footer{padding:32px 22px;margin-top:42px;border-top:1px solid var(--border);color:var(--muted);text-align:center;font-size:12.5px}
@media(max-width:720px){
  header{padding:10px 12px;gap:9px}
  .logo{font-size:17px}
  .search-\boxed{order:3;flex:1 1 100%;max-width:100%}
  main{padding:13px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
  .row .card{flex:0 0 132px}
  .hero{height:310px}
  .hero-info{padding:16px}
  .hero-info h1{font-size:21px}
  .modal-head h2{font-size:17px}
  .rank{font-size:42px}
}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()"><span class="film">🎬</span> MovieBox</div>
  <nav>
    <button class="nav-btn active" data-tab="home" onclick="switchTab('home')">Home</button>
    <button class="nav-btn" data-tab="movies" onclick="switchTab('movies')">Movies</button>
    <button class="nav-btn" data-tab="tv" onclick="switchTab('tv')">TV Shows</button>
    <button class="nav-btn adult" data-tab="adult" onclick="switchTab('adult')">🔞 18+</button>
    <button class="nav-btn" data-tab="list" onclick="switchTab('list')">⭐ My List</button>
  </nav>
  <div class="search-box"><span>🔍</span><input id="searchInput" type="text" placeholder="Search..." onkeydown="if(event.key==='Enter') doSearch()"></div>
  <div class="rd-badge off" id="rdBadge">⚡ 4K</div>
  <button class="icon-btn" onclick="clearCache()" title="Clear cache">🧹</button>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Theme">🌙</button>
</header>

<main><div id="content"></div><div id="sentinel" style="height:55px"></div></main>

<footer>🎬 MovieBox · streaming aggregator</footer>

<!-- ═══ DETAIL MODAL ═══ -->
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-hero" id="modalHero"></div>
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div class="modal-head"><div><h2 id="modalTitle">—</h2><div class="modal-sub" id="modalSub"></div></div></div>
    <div class="modal-body">
      <div class="player-wrap" id="playerWrap">
        <div class="player-placeholder" id="playerPlaceholder">
          <div class="spin"></div>
          <div class="msg">Loading player…</div>
        </div>
      </div>
      <div class="action-row" id="actionRow"></div>
      <div class="sources" id="sourcesRow"></div>
      <div id="epSelector"></div>
      <div class="ep-grid" id="epList"></div>
      <div class="genres" id="modalGenres"></div>
      <p class="synopsis" id="modalSynopsis"></p>
    </div>
  </div>
</div>

<!-- ═══ AGE GATE ═══ -->
<div class="age-gate" id="ageGate">
  <div class="warn">🔞</div>
  <h2>Are you 18 or older?</h2>
  <p>This section contains adult content. By entering you confirm you are of legal age to view explicit material in your jurisdiction.</p>
  <div class="actions">
    <button class="btn btn-gold" onclick="enterAdult()">Yes, I'm 18+</button>
    <button class="btn" style="background:var(--bg3);color:var(--text)" onclick="leaveAdult()">No, take me back</button>
  </div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};

let tab = 'home', genre = null, adultCat = 'trending', adultSource = 'all', query = '';
let pageNo = 1, allItems = [], loading = false, exhausted = false;
let myMovies = LS.get('mbx_list', []), myContinue = LS.get('mbx_continue', []);
let adultUnlocked = LS.get('mbx_age_ok', 0) === 1;
let currentItem = null, currentSources = [], srcIdx = 0, srcTimer = null, currentIsTV = false, currentEp = null;
let autoFallback = LS.get('mbx_autofb', true);
let srcHealth = LS.get('mbx_src_health', {});
let nextInfo = null, nextTimer = null;

// ── THEME ───────────────────────────────────────────
document.documentElement.dataset.theme = LS.get('mbx_theme', 'dark');
updateThemeBtn();
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; LS.set('mbx_theme', t); updateThemeBtn();
}
function updateThemeBtn() { $('#themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? '🌙' : '☀️'; }

async function clearCache() {
  try { await api('/api/cache/clear', { method: 'POST' }); showToast('Cache cleared'); } catch { showToast('Cache clear failed'); }
}

// ── FETCH (defensive) ───────────────────────────────
async function api(url, opts = {}) {
  let r;
  try { r = await fetch(url, opts); }
  catch (e) { throw new Error(`Network error: ${e.message}`); }
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('application/json')) {
    const txt = await r.text().catch(() => '');
    throw new Error(`${url} returned non-JSON (status ${r.status}). First bytes: ${txt.slice(0, 80)}`);
  }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status} on ${url}`);
  return d;
}
const list = d => Array.isArray(d?.results) ? d.results : [];

// ── CARD (data-attribute safe, no inline JSON) ──────
function cardHTML(it, opts = {}) {
  const poster = it.poster || it.thumbnail || it.image || 'https://placehold.co/300x450/12151d/8d94a3?text=No+Poster';
  const title = String(it.title || it.name || 'Untitled');
  const inList = myMovies.some(m => String(m.id) === String(it.id));
  const cont = myContinue.find(c => String(c.id) === String(it.id) && c.progress > 1 && c.progress < 98);
  const type = opts.adult ? 'adult' : (opts.tv ? 'tv' : 'movie');
  const source = it.source || '';
  return `
  <div class="card ${opts.adult ? 'adult' : ''}"
       data-id="${String(it.id).replace(/"/g, '&quot;')}"
       data-type="${type}"
       data-source="${String(source).replace(/"/g, '&quot;')}"
       onclick="openFromCard(this)">
    <div class="poster-wrap">
      ${opts.rank ? `<div class="rank">${opts.rank}</div>` : ''}
      <img class="poster" src="${poster}" alt="" loading="lazy"
           onerror="this.onerror=null;this.src='https://placehold.co/300x450/12151d/8d94a3?text=No+Poster'">
      <div class="play-overlay"><span>▶</span></div>
      <button class="fav-btn ${inList ? 'on' : ''}" onclick="event.stopPropagation();toggleFavFromCard(this)">${inList ? '★' : '☆'}</button>
      <div class="badge">
        ${it.duration ? `<b>⏱ ${it.duration}</b>` : ''}
        ${it.views ? `<b>👁 ${it.views}</b>` : ''}
        ${it.rating ? `<b class="gold">★ ${it.rating}</b>` : ''}
      </div>
    </div>
    <div class="info">
      <div class="title" title="${title.replace(/"/g, '&quot;')}">${title}</div>
      <div class="meta"><span>${it.year || source || ''}</span></div>
      ${cont ? `<div class="progress"><i style="width:${Math.min(100, cont.progress)}%"></i></div>` : ''}
    </div>
  </div>`;
}

function rowHTML(title, items, opts = {}) {
  if (!items || !items.length) return '';
  return `<div class="section-title"><div class="dot"></div>${title}${opts.sub ? `<span class="sub">${opts.sub}</span>` : ''}</div>
    <div class="row">${items.map((it, i) => cardHTML(it, { ...opts, rank: opts.ranked ? i + 1 : 0 })).join('')}</div>`;
}
function gridHTML(items, opts = {}) {
  if (!items || !items.length) return `<div class="status"><div style="font-size:38px;margin-bottom:9px">🤷</div>No results found.</div>`;
  return `<div class="grid">${items.map(it => cardHTML(it, opts)).join('')}</div>`;
}
const skeletonHTML = (n = 12) => `<div class="grid">${Array.from({ length: n }, () =>
  `<div><div class="sk-poster skeleton"></div><div class="sk-line skeleton"></div><div class="sk-line skeleton" style="width:60%"></div></div>`).join('')}</div>`;
const errorHTML = (msg, retryFn = 'render()') => `
  <div class="status error"><strong>⚠️ Failed to load</strong><br><br>${msg}
  <div class="retry"><button class="btn btn-primary" onclick="${retryFn}">↻ Retry</button></div></div>`;

// ── HERO ────────────────────────────────────────────
function heroHTML(items) {
  const top = (items || []).filter(i => i.backdrop).slice(0, 5);
  if (!top.length) return '';
  return `<div class="hero" id="hero">
    ${top.map((it, i) => `
      <div class="hero-slide ${i === 0 ? 'active' : ''}" style="background-image:url('${it.backdrop}')">
        <div class="hero-info">
          <div class="hero-meta">
            ${it.rating ? `<span style="color:var(--gold);font-weight:700">★ ${it.rating}</span>` : ''}
            ${it.year ? `<span>📅 ${it.year}</span>` : ''}
            <span style="background:var(--accent);padding:2px 9px;border-radius:9px;font-size:10.5px;font-weight:700">HD</span>
          </div>
          <h1>${it.title}</h1>
          <p>${it.overview || ''}</p>
          <div class="hero-actions">
            <button class="btn btn-primary" onclick="event.stopPropagation();openById('${it.id}','movie')">▶ Watch Now</button>
            <button class="btn btn-ghost" onclick="event.stopPropagation();openTrailer('${it.id}')">▶ Trailer</button>
          </div>
        </div>
      </div>`).join('')}
    <div class="hero-dots">${top.map((_, i) => `<span class="${i === 0 ? 'on' : ''}" onclick="heroGo(${i})"></span>`).join('')}</div>
  </div>`;
}
let heroIdx = 0, heroTimer = null, heroCount = 0;
function heroStart() {
  clearInterval(heroTimer);
  heroCount = $$('.hero-slide').length;
  if (heroCount < 2) return;
  heroTimer = setInterval(() => heroGo((heroIdx + 1) % heroCount), 6500);
}
function heroGo(i) {
  heroIdx = i;
  $$('.hero-slide').forEach((s, k) => s.classList.toggle('active', k === i));
  $$('.hero-dots span').forEach((d, k) => d.classList.toggle('on', k === i));
}

// ── TABS & RENDER ───────────────────────────────────
function switchTab(t) {
  if (t === 'adult' && !adultUnlocked) { $('#ageGate').classList.add('open'); return; }
  tab = t; genre = null; adultCat = 'trending'; query = '';
  $('#searchInput').value = '';
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  render();
}
function goHome() { switchTab('home'); }

async function render() {
  clearInterval(heroTimer);
  const el = $('#content');
  el.innerHTML = skeletonHTML(12);
  allItems = []; pageNo = 1; exhausted = false;
  try {
    if (tab === 'home') await renderHome(el);
    else if (tab === 'movies') await renderListTab(el, 'movie');
    else if (tab === 'tv') await renderListTab(el, 'tv');
    else if (tab === 'adult') await renderAdult(el);
    else if (tab === 'list') renderMyList(el);
  } catch (e) {
    el.innerHTML = errorHTML(e.message);
  }
}

async function renderHome(el) {
  const [trend, more, tv] = await Promise.all([
    api('/api/movies/trending?page=1'),
    api('/api/movies/trending?page=2').catch(() => ({ results: [] })),
    api('/api/tv/trending?page=1').catch(() => ({ results: [] }))
  ]);
  const items = list(trend), moreItems = list(more);
  allItems = [...items, ...moreItems];
  el.innerHTML = heroHTML(items) +
    rowHTML('▶ Continue Watching', myContinue.slice(0, 12)) +
    rowHTML('🏆 Top 10 This Week', items.slice(0, 10), { ranked: true }) +
    `<div class="section-title"><div class="dot"></div>Trending Now<span class="sub">auto-scroll to load more</span></div><div class="grid" id="mainGrid">${items.map(it => cardHTML(it)).join('')}</div>` +
    rowHTML('📺 Popular TV Shows', list(tv).slice(0, 12), { tv: true });
  heroStart();
  setupInfinite();
}

const MOVIE_GENRES = [['all','All'],['action','Action'],['comedy','Comedy'],['horror','Horror'],['romance','Romance'],['sci-fi','Sci-Fi'],['thriller','Thriller'],['drama','Drama'],['animation','Animation'],['fantasy','Fantasy'],['adventure','Adventure'],['crime','Crime']];

async function renderListTab(el, kind) {
  if (kind === 'movie') {
    el.innerHTML = `<div class="pills">${MOVIE_GENRES.map(([k, l]) =>
      `<button class="pill ${genre === k ? 'active' : ''}" onclick="selectGenre('${k}')">${l}</button>`).join('')}</div><div class="grid" id="mainGrid"></div>`;
  } else {
    el.innerHTML = `<div class="grid" id="mainGrid"></div>`;
  }
  await loadPage();
  setupInfinite();
}
function selectGenre(g) { genre = (genre === g || g === 'all') ? null : g; render(); }

async function loadPage() {
  if (loading || exhausted) return;
  loading = true;
  const grid = $('#mainGrid');
  if (grid) grid.insertAdjacentHTML('beforeend', `<div id="lm" style="grid-column:1/-1">${skeletonHTML(6)}</div>`);
  try {
    let url;
    if (query) {
      url = tab === 'adult' ? `/api/adult/search?q=${encodeURIComponent(query)}&source=${adultSource}&page=${pageNo}`
        : tab === 'tv' ? `/api/tv/search?q=${encodeURIComponent(query)}&page=${pageNo}`
        : `/api/movies/search?q=${encodeURIComponent(query)}&page=${pageNo}`;
    } else if (tab === 'adult') {
      url = (adultCat && adultCat !== 'trending')
        ? `/api/adult/category/${encodeURIComponent(adultCat)}?source=${adultSource}&page=${pageNo}`
        : `/api/adult/trending?source=${adultSource}&page=${pageNo}`;
    } else if (tab === 'tv') {
      url = `/api/tv/trending?page=${pageNo}`;
    } else if (genre) {
      url = `/api/movies/genre/${encodeURIComponent(genre)}?page=${pageNo}`;
    } else {
      url = `/api/movies/trending?page=${pageNo}`;
    }
    const items = list(await api(url));
    if (!items.length) exhausted = true;
    allItems = [...allItems, ...items];
    if (grid) {
      $('#lm')?.remove();
      const opts = { adult: tab === 'adult', tv: tab === 'tv' };
      grid.insertAdjacentHTML('beforeend', items.map(it => cardHTML(it, opts)).join(''));
    }
    pageNo++;
  } catch (e) {
    $('#lm')?.remove();
    if (grid) grid.insertAdjacentHTML('beforeend', errorHTML(e.message, 'retryPage()'));
  } finally { loading = false; }
}
function retryPage() { exhausted = false; loadPage(); }

function setupInfinite() {
  window.__io && window.__io.disconnect();
  const io = new IntersectionObserver(es => {
    if (es[0].isIntersecting && $('#mainGrid') && !loading && !exhausted) loadPage();
  }, { rootMargin: '700px' });
  window.__io = io;
  io.observe($('#sentinel'));
}

const ADULT_CATS = [['trending','🔥 Trending'],['popular','⭐ Popular'],['new','🆕 New'],['amateur','Amateur'],['anal','Anal'],['asian','Asian'],['bbw','BBW'],['big-tits','Big Tits'],['blonde','Blonde'],['blowjob','Blowjob'],['brunette','Brunette'],['ebony','Ebony'],['latina','Latina'],['lesbian','Lesbian'],['mature','Mature'],['milf','MILF'],['teen','Teen'],['threesome','Threesome'],['toys','Toys']];
const ADULT_SOURCES = [['all','All Sources'],['xvideos','XVideos'],['xnxx','XNXX'],['spankbang','SpankBang'],['eporner','EPorner'],['redtube','RedTube']];

async function renderAdult(el) {
  el.innerHTML = `
    <div class="pills">${ADULT_SOURCES.map(([k, l]) => `<button class="pill adult ${adultSource === k ? 'active' : ''}" onclick="setAdultSource('${k}')">${l}</button>`).join('')}</div>
    <div class="pills">${ADULT_CATS.map(([k, l]) => `<button class="pill adult ${adultCat === k ? 'active' : ''}" onclick="selectAdultCat('${k}')">${l}</button>`).join('')}</div>

function setAdultSource(s) { adultSource = s; render(); }
function selectAdultCat(c) { adultCat = (adultCat === c) ? 'trending' : c; render(); }

async function searchPerformer() {
  const name = $('#perfInput').value.trim();
  if (!name) return;
  query = name;
  const el = $('#content');
  el.innerHTML = skeletonHTML(12);
  try {
    const items = list(await api(`/api/adult/performer/${encodeURIComponent(name)}?source=${adultSource}&page=1`));

function renderMyList(el) {
  el.innerHTML = `<div class="section-title"><div class="dot"></div>⭐ My Watchlist<span class="sub">${myMovies.length} saved</span></div>
    ${gridHTML(myMovies)}${rowHTML('▶ Continue Watching', myContinue)}`;

// ── FAVORITES ───────────────────────────────────────
function toggleFavFromCard(btn) {
  const card = btn.closest('.card');
  const item = { id: card.dataset.id, title: card.querySelector('.title')?.textContent || '', poster: card.querySelector('.poster')?.src || '' };
  toggleFav(item);
  btn.textContent = myMovies.some(m => String(m.id) === String(item.id)) ? '★' : '☆';
  btn.classList.toggle('on', myMovies.some(m => String(m.id) === String(item.id)));
}
function toggleFav(item) {
  const i = myMovies.findIndex(m => String(m.id) === String(item.id));
  if (i >= 0) myMovies.splice(i, 1); else myMovies.unshift(item);
  LS.set('mbx_list', myMovies);
  showToast(i >= 0 ? 'Removed from My List' : '★ Added to My List');
}
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:11px 20px;border-radius:20px;font-weight:700;z-index:1000;box-shadow:0 8px 30px rgba(0,0,0,.5)';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

async function doSearch() {
  const q = $('#searchInput').value.trim();
  if (!q) return render();
  query = q;
  const el = $('#content');
  el.innerHTML = skeletonHTML(12);
  try {
    let items;
    if (tab === 'adult') items = list(await api(`/api/adult/search?q=${encodeURIComponent(q)}&source=${adultSource}&page=1`));
    else if (tab === 'tv') items = list(await api(`/api/tv/search?q=${encodeURIComponent(q)}&page=1`));
    else items = list(await api(`/api/movies/search?q=${encodeURIComponent(q)}&page=1`));
    allItems = items;
    el.innerHTML = `<div class="section-title"><div class="dot"></div>Results for "${q}"<span class="sub">${items.length} found</span></div>
      <div><button class="btn btn-ghost" onclick="render()" style="color:var(--text);margin-bottom:12px">← Clear search</button></div>
      <div class="grid" id="mainGrid">${items.map(it => cardHTML(it, { adult: tab === 'adult', tv: tab === 'tv' })).join('')}</div>`;
  } catch (e) { el.innerHTML = errorHTML(e.message, 'doSearch()'); }
}

// ═══════════════════════════════════════════════════
// DETAIL MODAL — always shows SOMETHING, never black
// ═══════════════════════════════════════════════════
function openFromCard(el) {
  const id = el.dataset.id;
  const type = el.dataset.type || 'movie';
  const source = el.dataset.source || '';
  if (!id) { showToast('Missing movie ID — try refreshing'); return; }
  openDetail(id, type, source);
}
function openById(id, type) { openDetail(id, type, ''); }

function placeholderHTML(kind, msg, extra = '') {
  return `<div class="player-placeholder">
    <div class="big-play" onclick="retryCurrent()">▶</div>
    <div class="msg"><strong>${kind}</strong><br>${msg}</div>
    ${extra}
    <button class="btn btn-primary" onclick="retryCurrent()">↻ Retry</button>
  </div>`;
}

async function openDetail(id, type, source) {
  currentItem = { id, type, source };
  clearTimeout(srcTimer); clearInterval(nextTimer);
  currentSources = []; currentEp = null; nextInfo = null;

  $('#modalBackdrop').classList.add('open');
  $('#modalTitle').textContent = type === 'adult' ? 'Adult Video' : (type === 'tv' ? 'TV Show' : 'Movie');
  $('#modalSub').innerHTML = 'Loading…';
  $('#modalHero').style.backgroundImage = 'none';
  $('#modalSynopsis').textContent = '';
  $('#modalGenres').innerHTML = '';
  $('#actionRow').innerHTML = '';
  $('#sourcesRow').innerHTML = '';
  $('#epSelector').innerHTML = '';
  $('#epList').innerHTML = '';
  $('#playerWrap').innerHTML = placeholderHTML('Loading', 'Fetching stream sources…');

  try {
    if (type === 'adult') {
      const d = await api(`/api/adult/video/${encodeURIComponent(source || 'xvideos')}/${encodeURIComponent(id)}`);
      renderAdultDetail(d);
    } else if (type === 'tv') {
      const d = await api(`/api/tv/${encodeURIComponent(id)}`);
      renderTVDetail(d);
    } else {
      let d;
      try { d = await api(`/api/movie/${encodeURIComponent(id)}`); }
      catch { d = await api(`/api/tv/${encodeURIComponent(id)}`); type = 'tv'; currentItem.type = 'tv'; }
      if (type === 'tv') renderTVDetail(d); else renderMovieDetail(d);
    }
  } catch (e) {
    $('#modalSub').innerHTML = `<span style="color:var(--accent2)">⚠️ ${e.message}</span>`;
    $('#playerWrap').innerHTML = placeholderHTML('Failed to load',
      'The details request failed. Check your connection and try again.',
      `<div class="err">${e.message}</div>`);
  }
}

function retryCurrent() {
  if (currentItem) openDetail(currentItem.id, currentItem.type, currentItem.source);
}

function actionButtonsHTML(trailerId) {
  return `
    <button class="btn btn-ghost" style="color:var(--text);border-color:var(--border)" onclick="toggleFav(currentItem)">☆ My List</button>
    ${trailerId ? `<button class="btn btn-ghost" style="color:var(--text);border-color:var(--border)" onclick="openTrailer('${trailerId}')">▶ Trailer</button>` : ''}`;
}

function renderMovieDetail(d) {
  $('#modalTitle').textContent = d.title || 'Untitled';
  $('#modalHero').style.backgroundImage = d.backdrop || d.poster ? `url('${d.backdrop || d.poster}')` : 'none';
  $('#modalSub').innerHTML = [d.year && `📅 ${d.year}`, d.rating && `★ ${d.rating}`, d.runtime && `⏱ ${d.runtime}`].filter(Boolean).join('');
  $('#modalSynopsis').textContent = d.synopsis || 'No synopsis available.';
  $('#modalGenres').innerHTML = (d.genres || []).map(g => `<span class="genre-tag">${g}</span>`).join('');
  $('#actionRow').innerHTML = actionButtonsHTML(d.id);
  $('#playerWrap').innerHTML = placeholderHTML('Ready to play', 'Click a source below to start streaming.');
  loadSources(`/api/movie/${encodeURIComponent(d.id)}/sources`, false);
}

function renderTVDetail(d) {
  $('#modalTitle').textContent = d.title || 'Untitled';
  $('#modalHero').style.backgroundImage = d.backdrop || d.poster ? `url('${d.backdrop || d.poster}')` : 'none';
  $('#modalSub').innerHTML = [d.year && `📅 ${d.year}`, d.rating && `★ ${d.rating}`, 'TV Series'].filter(Boolean).join('');
  $('#modalSynopsis').textContent = d.synopsis || 'No synopsis available.';
  $('#modalGenres').innerHTML = (d.genres || []).map(g => `<span class="genre-tag">${g}</span>`).join('');
  $('#actionRow').innerHTML = actionButtonsHTML(null);
  $('#playerWrap').innerHTML = placeholderHTML('Ready to play', 'Pick an episode below to start streaming.');
  const seasons = d.seasons || [];
  if (!seasons.length) {
    $('#epSelector').innerHTML = `<div style="color:var(--muted);padding:12px 0;font-size:13px">No seasons found.</div>`;
    return;
  }
  $('#epSelector').innerHTML = `<div style="display:flex;gap:8px;align-items:center;padding:8px 0;flex-wrap:wrap">
    <select id="seasonSel" onchange="loadSeason('${d.id}')"
      style="background:var(--bg3);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:8px">
      ${seasons.map(s => `<option value="${s.number}">Season ${s.number} (${s.episodes} eps)</option>`).join('')}
    </select>
    <span style="color:var(--muted);font-size:12px">Pick an episode below</span>
  </div>`;
  loadSeason(d.id);
}

async function loadSeason(id) {
  const season = $('#seasonSel')?.value || 1;
  const listEl = $('#epList');
  listEl.innerHTML = `<div class="status" style="grid-column:1/-1;padding:20px"><div class="spin" style="margin:0 auto 10px"></div>Loading episodes…</div>`;
  try {
    const s = await api(`/api/tv/${encodeURIComponent(id)}/season/${encodeURIComponent(season)}`);
    const eps = s.episodes || [];
    if (!eps.length) {
      listEl.innerHTML = `<div class="status" style="grid-column:1/-1">No episodes found for Season ${season}.</div>`;
      return;
    }
    listEl.innerHTML = eps.map(e => `
      <div class="ep-card" data-s="${season}" data-e="${e.number}" onclick="playEpisode('${id}','${season}','${e.number}',this)">
        ${e.thumb ? `<img src="${e.thumb}" alt="" onerror="this.style.display='none'">` : `<div style="width:82px;aspect-ratio:16/9;background:var(--bg2);border-radius:5px"></div>`}
        <div><div class="ep-t">E${e.number} · ${e.title || 'Untitled'}</div><div class="ep-d">${e.air_date || ''}</div></div>
      </div>`).join('');
    playEpisode(id, season, eps[0].number, listEl.querySelector('.ep-card'));
  } catch (e) {
    listEl.innerHTML = errorHTML(e.message, `loadSeason('${id}')`);
  }
}

async function playEpisode(id, season, episode, cardEl) {
  clearTimeout(srcTimer); clearInterval(nextTimer);
  $$('.ep-card').forEach(c => c.classList.remove('active'));
  cardEl && cardEl.classList.add('active');
  currentEp = { id, season, episode };
  currentIsTV = true;
  $('#playerWrap').innerHTML = placeholderHTML('Loading episode', `S${season} · E${episode}`);
  try {
    const d = await api(`/api/tv/${encodeURIComponent(id)}/${encodeURIComponent(season)}/${encodeURIComponent(episode)}`);
    nextInfo = d.next || null;
    $('#modalSub').innerHTML = [d.title && `📺 ${d.title}`, d.air_date && `📅 ${d.air_date}`].filter(Boolean).join('') || $('#modalSub').innerHTML;
    renderSources(d.sources || [], d.title, true);
  } catch (e) {
    $('#playerWrap').innerHTML = placeholderHTML('Episode load failed', 'Could not fetch episode streams.', `<div class="err">${e.message}</div>`);
  }
}

function renderAdultDetail(d) {
  $('#modalTitle').textContent = d.title || 'Adult Video';
  $('#modalHero').style.backgroundImage = d.thumb ? `url('${d.thumb}')` : 'none';
  $('#modalSub').innerHTML = [d.duration && `⏱ ${d.duration}`, d.views && `👁 ${d.views}`, d.source && `source: ${d.source}`].filter(Boolean).join('');
  $('#actionRow').innerHTML = actionButtonsHTML(null);
  const src = (Array.isArray(d.sources) && d.sources.length) ? d.sources
            : (d.url ? [{ name: 'Primary', quality: 'HD', url: d.url }] : []);
  renderSources(src, d.title, false);
}

// ═══════════════════════════════════════════════════
// SOURCES + PLAYER — NEVER empty
// ═══════════════════════════════════════════════════
async function loadSources(url, isTV) {
  try {
    const d = await api(url);
    const src = Array.isArray(d.sources) ? d.sources.filter(s => s && s.url) : [];
    if (!src.length) throw new Error('Server returned no playable sources');
    renderSources(src, $('#modalTitle').textContent, isTV);
  } catch (e) {
    $('#sourcesRow').innerHTML = `<div style="width:100%">${errorHTML(e.message, 'retryCurrent()')}</div>`;
    $('#playerWrap').innerHTML = placeholderHTML('No stream sources',
      'The server could not return any playable URLs for this title.',
      `<div class="err">${e.message}</div>`);
  }
}

function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return String(u).slice(0, 24); } }
function hostScore(u) { const h = srcHealth[hostOf(u)]; return h ? (h.ok * 2 - h.fail) : 0; }
function markSource(u, ok) {
  const h = hostOf(u);
  const r = srcHealth[h] || { ok: 0, fail: 0 };
  ok ? r.ok++ : r.fail++;
  srcHealth[h] = r;
  LS.set('mbx_src_health', srcHealth);
}
const healthDot = s => s?.health === 'ok' ? '🟢' : s?.health === 'slow' ? '🟡' : '🔴';

function renderSources(sources, title, isTV = false) {
  currentIsTV = !!isTV;
  const row = $('#sourcesRow');
  const arr = Array.isArray(sources) ? sources.filter(s => s && s.url) : [];

  // ALWAYS render the toggle + buttons row
  const toggleBtn = `<button class="src-btn auto ${autoFallback ? '' : 'off'}" onclick="toggleFallback()">⚡ Auto-Fallback ${autoFallback ? 'ON' : 'OFF'}</button>`;

  if (!arr.length) {
    row.innerHTML = toggleBtn + `<div style="flex:1;padding:8px;color:var(--accent2);font-size:12.5px">⚠️ No playable sources returned for "${title || 'this title'}". Click ↻ Retry below or pick a different title.</div>
      <button class="src-btn" onclick="retryCurrent()">↻ Retry</button>`;
    $('#playerWrap').innerHTML = placeholderHTML('No sources available',
      `The server returned 0 playable URLs for "${title || 'this title'}". This is usually a scraper issue on our side.`,
      `<button class="btn btn-primary" onclick="retryCurrent()">↻ Retry</button>`);
    return;
  }

  currentSources = [...arr].sort((a, b) => hostScore(b.url) - hostScore(a.url));
  row.innerHTML = toggleBtn + currentSources.map((s, i) => `
    <button class="src-btn ${i === 0 ? 'active' : ''}" id="src${i}" onclick="playSource(${i})" title="${hostOf(s.url)}">
      ${healthDot(s)} ${s.name || 'Source ' + (i + 1)}${s.quality ? ' · ' + s.quality : ''}</button>`).join('');
  playSource(0);
}

function toggleFallback() {
  autoFallback = !autoFallback;
  LS.set('mbx_autofb', autoFallback);
  const b = document.querySelector('.src-btn.auto');
  if (b) {
    b.textContent = `⚡ Auto-Fallback ${autoFallback ? 'ON' : 'OFF'}`;
    b.classList.toggle('off', !autoFallback);
  }
  showToast(`Auto-Fallback ${autoFallback ? 'enabled' : 'disabled'}`);
}

function playSource(i) {
  const s = currentSources[i];
  if (!s) return;
  srcIdx = i;
  clearTimeout(srcTimer);
  $$('.src-btn[id^=src]').forEach(b => b.classList.remove('active'));
  $('#src' + i)?.classList.add('active');

  const wrap = $('#playerWrap');
  wrap.innerHTML = '';
  const isDirect = /\.(mp4|m3u8|webm|mkv)(\?|$)/i.test(s.url);

  if (isDirect) {
    const v = document.createElement('video');
    v.src = s.url; v.controls = true; v.autoplay = true; v.playsInline = true;
    v.style.cssText = 'width:100%;height:100%';
    v.oncanplay = () => { clearTimeout(srcTimer); markSource(s.url, true); $('#srcStatus')?.remove(); };
    v.onerror = () => failSource(s);
    wrap.appendChild(v);
    wrap.insertAdjacentHTML('beforeend', `<button class="pip-btn" onclick="goPiP()">⧉ PiP</button>`);
    srcTimer = setTimeout(() => { if ($('#srcStatus')) failSource(s); }, 10000);
  } else {
    const f = document.createElement('iframe');
    f.allowFullscreen = true;
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    f.referrerPolicy = 'no-referrer';
    f.style.cssText = 'width:100%;height:100%;border:0';
    let fired = false;
    f.onload = () => { if (fired) return; fired = true; clearTimeout(srcTimer); markSource(s.url, true); $('#srcStatus')?.remove(); };
    f.onerror = () => failSource(s);
    f.src = s.url;
    wrap.appendChild(f);
    srcTimer = setTimeout(() => { if (!fired) failSource(s); }, 8000);
  }

  wrap.insertAdjacentHTML('beforeend', `
    <div class="src-status" id="srcStatus">⏳ Trying ${s.name || 'source'} · ${hostOf(s.url)}</div>
    <div class="next-overlay" id="nextOverlay">
      <div style="font-size:36px">⏭</div>
      <h3 id="nextLabel">Next episode</h3>
      <div style="color:var(--muted)" id="nextCount">5</div>
      <div style="display:flex;gap:9px">
        <button class="btn btn-primary" onclick="playNextNow()">Play now</button>
        <button class="btn btn-ghost" onclick="cancelNext()">Cancel</button>
      </div>
    </div>`);
}

function failSource(s) {
  clearTimeout(srcTimer);
  markSource(s.url, false);
  const last = srcIdx + 1 >= currentSources.length;
  if (autoFallback && !last) {
    const next = currentSources[srcIdx + 1];
    showToast(`⚠️ ${s.name || 'Source'} failed — switching to ${next.name || 'next'}`);
    playSource(srcIdx + 1);
    return;
  }
  const wrap = $('#playerWrap');
  wrap.innerHTML = `<div class="player-placeholder">
    <div class="big-play" onclick="playSource(${srcIdx})">▶</div>
    <div class="msg"><strong>${autoFallback ? 'All sources failed' : 'Source failed'}</strong><br>
      Tried: ${currentSources.slice(0, srcIdx + 1).map(x => hostOf(x.url)).join(', ')}</div>
    <div class="err">Last error: source ${s.name || hostOf(s.url)} did not respond in time</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center">
      ${currentSources.map((x, i) => `<button class="src-btn" onclick="playSource(${i})">${healthDot(x)} ${x.name}</button>`).join('')}
      <button class="src-btn" onclick="retryCurrent()">↻ Refetch sources</button>
    </div>
  </div>`;
}

function goPiP() {
  const v = $('#playerWrap video');
  if (!v) return showToast('PiP works on direct video streams only');
  (document.pictureInPictureElement ? document.exitPictureInPicture() : v.requestPictureInPicture()).catch(() => showToast('PiP blocked'));
}

function startNextCountdown() {
  const ov = $('#nextOverlay');
  if (!ov || !nextInfo) return;
  ov.classList.add('show');
  $('#nextLabel').textContent = `Next: Season ${nextInfo.season} Episode ${nextInfo.episode}`;
  let n = 5;
  $('#nextCount').textContent = `Playing in ${n}s`;
  clearInterval(nextTimer);
  nextTimer = setInterval(() => {
    n--;
    $('#nextCount').textContent = `Playing in ${n}s`;
    if (n <= 0) playNextNow();
  }, 1000);
}
function cancelNext() { clearInterval(nextTimer); $('#nextOverlay')?.classList.remove('show'); }
function playNextNow() {
  if (!nextInfo || !currentEp) return cancelNext();
  cancelNext();
  playEpisode(currentEp.id, nextInfo.season, nextInfo.episode, null);
}

async function openTrailer(id) {
  try {
    const t = await api(`/api/movie/${encodeURIComponent(id)}/trailer`);
    window.open(t.url, '_blank');
  } catch (e) {
    showToast('No trailer available');
  }
}

function closeModal() {
  $('#modalBackdrop').classList.remove('open');
  clearTimeout(srcTimer); clearInterval(nextTimer);
  $('#playerWrap').innerHTML = placeholderHTML('Ready', 'Click a movie to play.');
  currentItem = null;
}
function enterAdult() {
  adultUnlocked = true;
  LS.set('mbx_age_ok', 1);
  $('#ageGate').classList.remove('open');
  switchTab('adult');
}
function leaveAdult() { $('#ageGate').classList.remove('open'); goHome(); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

(async () => {
  try {
    const s = await api('/api/debrid/status');
    const b = $('#rdBadge');
    if (s.enabled) { b.textContent = '⚡ 4K Ready'; b.classList.remove('off'); }
    else { b.textContent = '📋 4K via Magnet'; b.classList.add('off'); }
  } catch {
    const b = $('#rdBadge');
    b.textContent = '📋 4K via Magnet'; b.classList.add('off');
  }
})();

render();
</script>
</body>
</html>
