<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MovieBox</title>
<style>
:root{--bg:#0b0d12;--bg2:#12151d;--bg3:#1a1e28;--text:#f1f3f8;--muted:#8d94a3;--accent:#e50914;--accent2:#ff2f3c;--gold:#ffb300;--border:#262b37;--green:#22c55e}
[data-theme="light"]{--bg:#f4f5f8;--bg2:#fff;--bg3:#e9ebf0;--text:#12151d;--muted:#5c6474;--border:#d8dce4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{cursor:pointer;font-family:inherit}
input,select{font-family:inherit}
header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:21px;font-weight:800;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.logo .film{color:var(--accent)}
nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nav-btn{background:transparent;border:0;color:var(--muted);padding:8px 15px;border-radius:20px;font-size:14px;font-weight:600;white-space:nowrap;transition:.15s}
.nav-btn:hover{color:var(--text);background:var(--bg3)}
.nav-btn.active{background:var(--accent);color:#fff}
.nav-btn.adult{color:var(--gold)}
.nav-btn.adult.active{background:var(--gold);color:#111}
.search-\boxed{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);padding:8px 14px;border-radius:22px;min-width:180px;max-width:280px;flex:0 1 280px}
.search-box input{background:transparent;border:0;outline:none;color:var(--text);font-size:14px;flex:1;min-width:60px}
.icon-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:16px}
.icon-btn:hover{background:var(--bg3)}
.rd-badge{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:var(--green);padding:7px 13px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.rd-badge.off{background:rgba(255,179,0,.12);border-color:rgba(255,179,0,.35);color:var(--gold)}
main{padding:22px;max-width:1440px;margin:0 auto}
.section-title{font-size:19px;font-weight:700;margin:26px 0 15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-title .dot{width:6px;height:21px;background:var(--accent);border-radius:3px}
.section-title .sub{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto}
.hero{position:relative;border-radius:16px;overflow:hidden;height:390px;background:var(--bg3);margin-bottom:10px}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .7s;background-size:cover;background-position:center}
.hero-slide.active{opacity:1}
.hero-slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,13,18,.95) 0%,rgba(11,13,18,.55) 55%,rgba(11,13,18,.15) 100%)}
.hero-info{position:absolute;left:0;bottom:0;z-index:2;padding:32px;max-width:620px}
.hero-info h1{font-size:36px;line-height:1.12;margin-bottom:10px}
.hero-info p{color:#cfd4de;font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-meta{display:flex;gap:12px;align-items:center;margin-bottom:12px;font-size:13px;color:#cfd4de;flex-wrap:wrap}
.hero-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hero-dots{position:absolute;right:22px;bottom:22px;z-index:3;display:flex;gap:7px}
.hero-dots span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
.hero-dots span.on{background:var(--accent);width:24px;border-radius:5px}
.btn{padding:11px 22px;border-radius:24px;font-size:14px;font-weight:700;border:0;display:inline-flex;gap:8px;align-items:center}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-gold{background:var(--gold);color:#111}
.btn-gold:hover{filter:brightness(1.08)}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28)}
.btn-ghost:hover{background:rgba(255,255,255,.24)}
.row{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 16px;scrollbar-width:thin}
.row::-webkit-scrollbar{height:7px}
.row::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.row .card{flex:0 0 172px}
.rank{position:absolute;left:-6px;top:-6px;z-index:2;font-size:64px;font-weight:900;color:var(--text);-webkit-text-stroke:3px var(--accent);text-shadow:0 4px 16px rgba(0,0,0,.6);line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.card{background:var(--bg2);border-radius:10px;overflow:hidden;cursor:pointer;transition:.18s;border:1px solid var(--border);position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.poster-wrap{position:relative}
.card .poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--bg3);display:block}
.card.adult .poster{aspect-ratio:16/10}
.play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:.18s}
.play-overlay span{width:54px;height:54px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff}
.card:hover .play-overlay{opacity:1}
.badge{position:absolute;bottom:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.badge b{background:rgba(0,0,0,.78);color:#fff;padding:3px 9px;border-radius:11px;font-size:10.5px;font-weight:700}
.badge b.gold{background:var(--gold);color:#111}
.card .info{padding:10px 12px}
.card .title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--muted);font-size:11px;gap:8px}
.card .rating{color:var(--gold);font-weight:700}
.fav-btn{position:absolute;top:8px;right:8px;z-index:3;background:rgba(0,0,0,.65);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:15px;opacity:0;transition:.15s}
.card:hover .fav-btn{opacity:1}
.fav-btn.on{opacity:1;color:var(--gold)}
.progress{height:4px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;flex-wrap:wrap}
.pills::-webkit-scrollbar{display:none}
.pill{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;transition:.15s}
.pill:hover{border-color:var(--accent);color:var(--accent2)}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.adult.active{background:var(--gold);color:#111;border-color:var(--gold)}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
.filters select,.filters input{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;outline:none}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin-top:12px;max-height:340px;overflow-y:auto;padding-right:4px}
.ep-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;display:flex;gap:10px;padding:8px;transition:.15s}
.ep-card:hover,.ep-card.active{border-color:var(--accent)}
.ep-card img{width:86px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;background:var(--bg2);flex-shrink:0}
.ep-card .ep-t{font-size:12px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-card .ep-d{font-size:10.5px;color:var(--muted);margin-top:4px}
.modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.87);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;backdrop-filter:blur(8px)}
.modal-backdrop.open{display:flex}
.modal{background:var(--bg2);border-radius:14px;width:100%;max-width:1000px;border:1px solid var(--border);overflow:hidden}
.modal-hero{height:230px;background-size:cover;background-position:center;position:relative}
.modal-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),var(--bg2))}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 22px 0;position:relative;z-index:2;margin-top:-46px}
.modal-head h2{font-size:23px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.modal-sub{color:var(--muted);font-size:13px;margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.close-btn{background:rgba(0,0,0,.6);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:19px;position:absolute;top:14px;right:14px;z-index:5}
.close-btn:hover{background:var(--accent)}
.modal-body{padding:18px 22px 26px}
.player-wrap{width:100%;aspect-ratio:16/9;background:#000;border-radius:9px;overflow:hidden;position:relative}
.player-wrap video,.player-wrap iframe{width:100%;height:100%;border:0;display:block}
.pip-btn{position:absolute;right:12px;bottom:12px;z-index:4;background:rgba(0,0,0,.7);border:0;color:#fff;padding:8px 13px;border-radius:8px;font-size:12px;font-weight:700}
.next-overlay{position:absolute;inset:0;background:rgba(11,13,18,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:6;text-align:center;padding:20px}
.next-overlay.show{display:flex}
.src-status{position:absolute;left:12px;top:12px;z-index:7;background:rgba(0,0,0,.72);color:#fff;padding:7px 13px;border-radius:9px;font-size:12px;font-weight:600}
.src-tabs{display:flex;gap:6px;margin:16px 0 4px;border-bottom:1px solid var(--border);padding-bottom:0}
.src-tab{background:transparent;border:0;color:var(--muted);padding:10px 16px;font-size:13px;font-weight:700;border-bottom:2px solid transparent;margin-bottom:-1px}
.src-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.src-tab .tag{background:var(--gold);color:#111;padding:2px 8px;border-radius:8px;font-size:10px;margin-left:6px;font-weight:800}
.sources{display:flex;gap:8px;overflow-x:auto;padding:12px 0;flex-wrap:wrap}
.src-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600}
.src-btn:hover,.src-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.src-btn.auto{background:var(--gold);color:#111;border-color:var(--gold)}
.src-btn.auto.off{background:var(--bg3);color:var(--text);border-color:var(--border)}
.torrent-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.torrent-row{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.torrent-row:hover{border-color:var(--gold)}
.torrent-q{background:var(--gold);color:#111;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:800;flex-shrink:0}
.torrent-q.q1080{background:var(--accent);color:#fff}
.torrent-q.qcam{background:var(--muted);color:#fff}
.torrent-name{flex:1;min-width:180px;font-size:12.5px;font-weight:600;line-height:1.4;word-break:break-word}
.torrent-meta{color:var(--muted);font-size:11px;display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0}
.torrent-meta .seed{color:var(--green);font-weight:700}
.torrent-actions{display:flex;gap:6px;flex-shrink:0}
.mini-btn{background:var(--accent);color:#fff;border:0;padding:7px 12px;border-radius:7px;font-size:11.5px;font-weight:700}
.mini-btn.ghost{background:var(--bg2);color:var(--text);border:1px solid var(--border)}
.mini-btn:disabled{opacity:.5;cursor:not-allowed}
.synopsis{color:var(--muted);font-size:14px;line-height:1.65;margin:12px 0}
.genres{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.genre-tag{background:var(--bg3);color:var(--text);padding:5px 12px;border-radius:14px;font-size:12px;border:1px solid var(--border)}
.action-row{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.skeleton{background:linear-gradient(90deg,var(--bg2),var(--bg3),var(--bg2));background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-poster{width:100%;aspect-ratio:2/3;border-radius:10px}
.sk-line{height:12px;border-radius:4px;margin-top:10px}
.status{text-align:center;padding:58px 20px;color:var(--muted);font-size:15px}
.status.error{color:var(--accent2);background:rgba(229,9,20,.08);border:1px solid rgba(229,9,20,.25);border-radius:12px;margin:18px 0;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;text-align:left}
.retry{margin-top:14px}
.age-gate{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center;backdrop-filter:blur(14px)}
.age-gate.open{display:flex}
.age-gate .warn{font-size:70px;margin-bottom:16px}
.age-gate h2{font-size:29px;margin-bottom:10px}
.age-gate p{color:var(--muted);font-size:15px;max-width:520px;line-height:1.6;margin-bottom:26px}
.age-gate .actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
footer{padding:34px 24px;margin-top:46px;border-top:1px solid var(--border);color:var(--muted);text-align:center;font-size:13px}
@media(max-width:720px){
  header{padding:11px 13px;gap:11px}
  .logo{font-size:18px}
  .search-\boxed{order:3;flex:1 1 100%;max-width:100%}
  main{padding:14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:11px}
  .row .card{flex:0 0 138px}
  .hero{height:320px}
  .hero-info{padding:18px}
  .hero-info h1{font-size:23px}
  .hero-info p{-webkit-line-clamp:2}
  .modal-head h2{font-size:18px}
  .rank{font-size:44px}
}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()"><span class="film">🎬</span> MovieBox</div>
  <nav>
    <button class="nav-btn active" data-tab="home" onclick="switchTab('home')">Home</button>
    <button class="nav-btn" data-tab="movies" onclick="switchTab('movies')">Movies</button>
    <button class="nav-btn" data-tab="tv" onclick="switchTab('tv')">TV Shows</button>
    <button class="nav-btn adult" data-tab="adult" onclick="switchTab('adult')">🔞 18+</button>
    <button class="nav-btn" data-tab="list" onclick="switchTab('list')">⭐ My List</button>
  </nav>
  <div class="search-box">
    <span>🔍</span>
    <input id="searchInput" type="text" placeholder="Search..." onkeydown="if(event.key==='Enter') doSearch()">
  </div>
  <div class="rd-badge off" id="rdBadge">⚡ 4K</div>
  <button class="icon-btn" onclick="clearCache()" title="Clear cache">🧹</button>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
</header>

<main id="main"><div id="content"></div><div id="sentinel" style="height:60px"></div></main>

<footer>🎬 MovieBox · streaming aggregator · content sourced from public APIs &amp; embed providers</footer>

<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-hero" id="modalHero"></div>
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div class="modal-head"><div><h2 id="modalTitle">—</h2><div class="modal-sub" id="modalSub"></div></div></div>
    <div class="modal-body">
      <div class="player-wrap" id="playerWrap">
        <div class="next-overlay" id="nextOverlay">
          <div style="font-size:40px">⏭</div>
          <h3 id="nextLabel">Next episode</h3>
          <div style="color:var(--muted)" id="nextCount">5</div>
          <div style="display:flex;gap:10px">
            <button class="btn btn-primary" onclick="playNextNow()">Play now</button>
            <button class="btn btn-ghost" onclick="cancelNext()">Cancel</button>
          </div>
        </div>
      </div>
      <div class="action-row" id="actionRow"></div>
      <div class="src-tabs">
        <button class="src-tab active" id="tabStreams" onclick="switchSrcTab('streams')">🎬 Streams</button>
        <button class="src-tab" id="tab4k" onclick="switchSrcTab('4k')">🎞️ 4K Torrents <span class="tag">NEW</span></button>
      </div>
      <div id="streamPane">
        <div class="sources" id="sourcesRow"></div>
        <div class="filters" id="epSelector"></div>
        <div class="ep-grid" id="epList"></div>
      </div>
      <div id="torrentPane" style="display:none">
        <div class="torrent-list" id="torrentList"></div>
      </div>
      <div class="genres" id="modalGenres"></div>
      <p class="synopsis" id="modalSynopsis"></p>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="trailerModal" onclick="if(event.target===this) closeTrailer()">
  <div class="modal" style="max-width:900px">
    <div style="position:relative">
      <button class="close-btn" onclick="closeTrailer()">✕</button>
      <div class="player-wrap" id="trailerWrap" style="border-radius:14px 14px 0 0"></div>
    </div>
  </div>
</div>

<div class="age-gate" id="ageGate">
  <div class="warn">🔞</div>
  <h2>Are you 18 or older?</h2>
  <p>This section contains adult content. By entering you confirm you are of legal age to view explicit material in your jurisdiction.</p>
  <div class="actions">
    <button class="btn btn-gold" onclick="enterAdult()">Yes, I'm 18+</button>
    <button class="btn" style="background:var(--bg3);color:var(--text)" onclick="leaveAdult()">No, take me back</button>
  </div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};
let tab = 'home', genre = null, adultCat = 'trending', adultSource = 'all', query = '';
let pageNo = 1, allItems = [], loading = false, exhausted = false, sortMode = 'pop';
let myMovies = LS.get('mbx_list', []), myContinue = LS.get('mbx_continue', []);
let adultUnlocked = LS.get('mbx_age_ok', 0) === 1;
let nextInfo = null, nextTimer = null, currentEp = null, currentItem = null;
let currentSources = [], srcIdx = 0, srcTimer = null, currentIsTV = false;
let autoFallback = LS.get('mbx_autofb', true);
let srcHealth = LS.get('mbx_src_health', {});
let srcTab = 'streams';
let debridStatus = { enabled: false };

// Theme
document.documentElement.dataset.theme = LS.get('mbx_theme', 'dark');
updateThemeBtn();
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; LS.set('mbx_theme', t); updateThemeBtn();
}
function updateThemeBtn() { $('#themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? '🌙' : '☀️'; }

async function clearCache() {
  try { await api('/api/cache/clear', { method: 'POST' }); showToast('Cache cleared'); } catch { showToast('Cache clear failed'); }
}

// Fetch
async function api(url, opts = {}) {
  const r = await fetch(url, opts);
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('application/json')) throw new Error(`${url} → non-JSON (status ${r.status})`);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}
const list = d => Array.isArray(d?.results) ? d.results : [];

// Cards
function cardHTML(it, opts = {}) {
  const poster = it.poster || it.thumbnail || it.image || 'https://placehold.co/300x450/12151d/8d94a3?text=No+Poster';
  const title = String(it.title || it.name || 'Untitled').replace(/"/g, '&quot;');
  const inList = myMovies.some(m => String(m.id) === String(it.id));
  const cont = myContinue.find(c => String(c.id) === String(it.id) && c.progress > 1 && c.progress < 98);
  const data = { id: it.id, title: it.title || it.name, poster, adult: opts.adult ? 1 : 0, source: it.source || '', tv: opts.tv ? 1 : 0, year: it.year || '' };
  const j = JSON.stringify(data).replace(/'/g, '&#39;');
  return `
  <div class="card ${opts.adult ? 'adult' : ''}" onclick='openDetail(${j})'>
    <div class="poster-wrap">
      ${opts.rank ? `<div class="rank">${opts.rank}</div>` : ''}
      <img class="poster" src="${poster}" alt="${title}" loading="lazy"
           onerror="this.src='https://placehold.co/300x450/12151d/8d94a3?text=No+Poster'">
      <div class="play-overlay"><span>▶</span></div>

function rowHTML(title, items, opts = {}) {

function gridHTML(items, opts = {}) {

const skeletonHTML = (n = 12) => `<div class="grid">${Array.from({ length: n }, () =>

let heroIdx = 0, heroTimer = null, heroCount = 0;
function heroStart() {
  clearInterval(heroTimer);
  heroCount = $$('.hero-slide').length;
  if (heroCount < 2) return;
  heroTimer = setInterval(() => heroGo((heroIdx + 1) % heroCount), 6500);
}
function heroGo(i) {
  heroIdx = i;
  $$('.hero-slide').forEach((s, k) => s.classList.toggle('active', k === i));
  $$('.hero-dots span').forEach((d, k) => d.classList.toggle('on', k === i));

  tab = t; genre = null; adultCat = 'trending'; query = '';

async function render() {

async function renderHome(el) {
  const [trend, trend2, tv, adultRow] = await Promise.all([
    api('/api/movies/trending?page=1'),
    api('/api/movies/trending?page=2').catch(() => ({ results: [] })),

  ]);

  allItems = items;
  el.innerHTML = heroHTML(items);
  const recent = [...more].sort((a, b) => (b.year || '').localeCompare(a.year || ''));

async function renderMovies(el) {

function selectGenre(g) { genre = (genre === g || g === 'all') ? null : g; render(); }

function filterBarHTML() {
  return `<div class="filters">
    <select onchange="setSort(this.value)">
      <option value="pop">Sort: Popularity</option>
      <option value="rating">Sort: Rating</option>
      <option value="year">Sort: Newest</option>
      <option value="title">Sort: A–Z</option>

    <span style="color:var(--muted);font-size:12px" id="filterCount"></span>
  </div>`;
}
function setSort(v) {
  sortMode = v;
  const sorted = [...allItems];
  if (sortMode === 'rating') sorted.sort((x, y) => (y.rating || 0) - (x.rating || 0));
  else if (sortMode === 'year') sorted.sort((x, y) => String(y.year || '').localeCompare(String(x.year || '')));
  else if (sortMode === 'title') sorted.sort((x, y) => String(x.title || '').localeCompare(String(y.title || '')));
  const g = $('#mainGrid');
  if (g) g.innerHTML = sorted.map(it => cardHTML(it, { adult: tab === 'adult', tv: tab === 'tv' })).join('');
}

async function loadPage() {
  if (loading || exhausted) return;
  loading = true;
  const grid = $('#mainGrid');
  if (grid) grid.insertAdjacentHTML('beforeend', `<div id="loadingMore" style="grid-column:1/-1">${skeletonHTML(6)}</div>`);
  try {
    let url;
    if (query) url = tab === 'adult' ? `/api/adult/search?q=${encodeURIComponent(query)}&source=${adultSource}&page=${pageNo}`
      : tab === 'tv' ? `/api/tv/search?q=${encodeURIComponent(query)}&page=${pageNo}`
      : `/api/movies/search?q=${encodeURIComponent(query)}&page=${pageNo}`;
    else if (tab === 'adult') url = (adultCat && adultCat !== 'trending')
      ? `/api/adult/category/${encodeURIComponent(adultCat)}?source=${adultSource}&page=${pageNo}`
      : `/api/adult/trending?source=${adultSource}&page=${pageNo}`;
    else if (tab === 'tv') url = `/api/tv/trending?page=${pageNo}`;
    else if (genre) url = `/api/movies/genre/${encodeURIComponent(genre)}?page=${pageNo}`;
    else url = `/api/movies/trending?page=${pageNo}`;

    const items = list(await api(url));
    if (!items.length) exhausted = true;
    allItems = [...allItems, ...items];
    if (grid) {
      $('#loadingMore')?.remove();
      grid.insertAdjacentHTML('beforeend', items.map(it => cardHTML(it, { adult: tab === 'adult', tv: tab === 'tv' })).join(''));
      const fc = $('#filterCount'); if (fc) fc.textContent = `${allItems.length} titles loaded`;
    }
    pageNo++;
  } catch (e) {
    $('#loadingMore')?.remove();
    if (grid) grid.insertAdjacentHTML('beforeend', errorHTML(e.message, 'retryPage()'));
  } finally { loading = false; }
}
function retryPage() { exhausted = false; loadPage(); }

function setupInfinite() {
  window.__io && window.__io.disconnect();
  const io = new IntersectionObserver(es => {
    if (es[0].isIntersecting && $('#mainGrid') && !loading && !exhausted) loadPage();
  }, { rootMargin: '700px' });
  window.__io = io;
  io.observe($('#sentinel'));
}

}

async function loadSeason(id) {
  const season = $('#seasonSel').value;
  const listEl = $('#epList');

      <div class="ep-card" onclick="playEpisode('${id}','${season}','${e.number}', this)">
        ${e.thumb ? `<img src="${e.thumb}" alt="E${e.number}" onerror="this.style.display='none'">` : `<div style="width:86px;aspect-ratio:16/9;background:var(--bg2);border-radius:5px"></div>`}

      </div>`).join('');
    playEpisode(id, season, eps[0].number, listEl.querySelector('.ep-card'));
  } catch (e) { listEl.innerHTML = errorHTML(e.message, `loadSeason('${id}')`); }
}

async function playEpisode(id, season, episode, cardEl) {

  try {

    const extra = nextInfo ? `<button class="btn btn-ghost" style="color:var(--text);border-color:var(--border)" onclick="playNextNow()">⏭ Next Episode</button>` : '';
    $('#actionRow').innerHTML = extra + $('#actionRow').innerHTML;

}

async function loadTorrents(kind, id, title, year) {
  const el = $('#torrentList');
  el.innerHTML = `<div class="status" style="padding:22px">⏳ Searching 4K torrents…</div>`;
  try {
    const q = `${title} ${year || ''}`.trim();
    const url = kind === 'tv'
      ? `/api/tv/${encodeURIComponent(id)}/${currentEp?.season || 1}/${currentEp?.episode || 1}/4k?q=${encodeURIComponent(q)}`
      : `/api/movie/${encodeURIComponent(id)}/4k?q=${encodeURIComponent(q)}`;
    const d = await api(url);
    const items = list(d);
    if (!items.length) {
      el.innerHTML = `<div class="status" style="padding:22px">🤷 No torrents found for "${q}"</div>`;
      return;
    }
    const sorted = [...items].sort((a, b) => {
      const r = { '4K': 0, '1080p': 1, '720p': 2, 'HD': 3, 'CAM': 4 };
      return (r[a.quality] ?? 9) - (r[b.quality] ?? 9) || (b.seeds || 0) - (a.seeds || 0);
    });
    debridStatus.enabled = d.debrid !== false;
    el.innerHTML = sorted.map((t, i) => {
      const qCls = t.quality === '4K' ? '' : (t.quality === '1080p' ? 'q1080' : (t.quality === 'CAM' ? 'qcam' : 'q1080'));
      const j = JSON.stringify(t).replace(/'/g, '&#39;');
      return `
      <div class="torrent-row">
        <div class="torrent-q ${qCls}">${t.quality || '?'}</div>
        <div class="torrent-name" title="${String(t.title).replace(/"/g, '&quot;')}">${t.title}</div>
        <div class="torrent-meta">
          <span class="seed">▲ ${t.seeds || 0}</span>
          <span>▼ ${t.peers || 0}</span>
          <span>💾 ${t.size || '?'}</span>
          <span>${t.source}</span>
        </div>
        <div class="torrent-actions">
          ${debridStatus.enabled
            ? `<button class="mini-btn" onclick='resolveAndPlay(${j})'>▶ Play</button>`
            : ''}
          <button class="mini-btn ghost" onclick='copyMagnet(${j})'>Copy</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = errorHTML(e.message, `loadTorrents('${kind}','${id}')`);
  }
}

async function resolveAndPlay(t) {
  const wrap = $('#playerWrap');
  switchSrcTab('streams');
  wrap.innerHTML = `<div class="src-status">⚡ Resolving 4K via Real-Debrid… (${t.source} · ${t.seeds || 0} seeds)</div>` + $('#nextOverlay').outerHTML;
  try {
    const d = await api('/api/torrent/resolve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ magnet: t.magnet, detailUrl: t.detailUrl, source: t.source, title: t.title })
    });
    const streams = d.streams || [];
    if (!streams.length) throw new Error('Real-Debrid returned no playable streams');
    renderSources(streams, t.title, false);
    showToast(`⚡ 4K resolved — ${streams.length} file${streams.length > 1 ? 's' : ''} ready`);
  } catch (e) {
    wrap.innerHTML = errorHTML(e.message, `resolveAndPlay(${JSON.stringify(t).replace(/'/g, '&#39;')})`) +
      `<div class="status" style="padding:14px"><button class="btn btn-gold" onclick='copyMagnet(${JSON.stringify(t).replace(/'/g, "&#39;")})'>📋 Copy Magnet instead</button></div>`;
  }
}

function copyMagnet(t) {
  const m = t.magnet || t.detailUrl;
  if (!m) return showToast('No magnet available');
  navigator.clipboard.writeText(m).then(() => showToast('📋 Magnet copied')).catch(() => showToast('Copy failed'));
}

// ═══════════════════════════════════════════
// PLAYER + AUTO-FALLBACK
// ═══════════════════════════════════════════
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return String(u).slice(0, 24); } }
function hostScore(u) { const h = srcHealth[hostOf(u)]; return h ? (h.ok * 2 - h.fail) : 0; }
function markSource(u, ok) {
  const h = hostOf(u);
  const r = srcHealth[h] || { ok: 0, fail: 0 };
  ok ? r.ok++ : r.fail++;
  srcHealth[h] = r;
  LS.set('mbx_src_health', srcHealth);
}
const healthDot = (s) => s.health === 'ok' ? '🟢' : s.health === 'slow' ? '🟡' : '🔴';

function renderSources(sources, title, isTV = false) {
  currentIsTV = !!isTV;
  const row = $('#sourcesRow');
  if (!Array.isArray(sources) || !sources.length) {
    row.innerHTML = `<div class="status" style="padding:8px">No sources available.</div>`;
    return;
  }
  currentSources = [...sources].sort((a, b) => hostScore(b.url) - hostScore(a.url));
  row.innerHTML = `
    <button class="src-btn auto ${autoFallback ? '' : 'off'}" onclick="toggleFallback()">⚡ Auto-Fallback ${autoFallback ? 'ON' : 'OFF'}</button>
    ${currentSources.map((s, i) => `
      <button class="src-btn ${i === 0 ? 'active' : ''}" id="src${i}" onclick="playSource(${i})" title="${hostOf(s.url)} · ${s.latency || '?'}ms">
        ${healthDot(s)} ${s.name || 'Source ' + (i + 1)} ${s.quality ? '· ' + s.quality : ''}</button>`).join('')}`;
  playSource(0);
}

function toggleFallback() {
  autoFallback = !autoFallback;
  LS.set('mbx_autofb', autoFallback);
  const b = document.querySelector('.src-btn.auto');
  if (b) {
    b.textContent = `⚡ Auto-Fallback ${autoFallback ? 'ON' : 'OFF'}`;
    b.classList.toggle('off', !autoFallback);
  }
  showToast(`Auto-Fallback ${autoFallback ? 'enabled' : 'disabled'}`);
}

function playSource(i) {
  const s = currentSources[i];
  if (!s) return;
  srcIdx = i;
  clearTimeout(srcTimer);
  $$('.src-btn[id^=src]').forEach(b => b.classList.remove('active'));
  const btn = $('#src' + i);
  btn && btn.classList.add('active');

  const wrap = $('#playerWrap');
  wrap.innerHTML = '';
  const isDirect = /\.(mp4|m3u8|webm|mkv)(\?|$)/i.test(s.url);

  if (isDirect) {
    const v = document.createElement('video');
    v.src = s.url; v.controls = true; v.autoplay = true; v.playsInline = true;
    v.style.cssText = 'width:100%;height:100%';
    v.oncanplay = () => { clearTimeout(srcTimer); markSource(s.url, true); const m = $('#srcStatus'); if (m) m.remove(); };
    v.onerror = () => failSource(s);
    v.ontimeupdate = () => { if (currentItem && v.duration) saveProgress((v.currentTime / v.duration) * 100); };
    v.onended = () => { if (currentIsTV && nextInfo) startNextCountdown(); };
    wrap.appendChild(v);
    wrap.insertAdjacentHTML('beforeend', `<button class="pip-btn" onclick="goPiP()">⧉ PiP</button>`);
    srcTimer = setTimeout(() => { const m = $('#srcStatus'); if (m) failSource(s); }, 10000);
  } else {
    const f = document.createElement('iframe');
    f.allowFullscreen = true;
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    f.style.cssText = 'width:100%;height:100%;border:0';
    let fired = false;
    f.onload = () => { if (fired) return; fired = true; clearTimeout(srcTimer); markSource(s.url, true); const m = $('#srcStatus'); if (m) m.remove(); };
    f.onerror = () => failSource(s);
    f.src = s.url;
    wrap.appendChild(f);
    srcTimer = setTimeout(() => { if (!fired) failSource(s); }, 8000);
  }

  wrap.insertAdjacentHTML('beforeend', `
    <div class="src-status" id="srcStatus">⏳ Trying ${s.name || 'source'}${s.health ? ` · ${healthDot(s)} ${s.latency || '?'}ms` : ''}</div>
    <div class="next-overlay" id="nextOverlay">
      <div style="font-size:40px">⏭</div>
      <h3 id="nextLabel">Next episode</h3>
      <div style="color:var(--muted)" id="nextCount">5</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-primary" onclick="playNextNow()">Play now</button>
        <button class="btn btn-ghost" onclick="cancelNext()">Cancel</button>
      </div>
    </div>`);
}

function failSource(s) {
  clearTimeout(srcTimer);
  markSource(s.url, false);
  const last = srcIdx + 1 >= currentSources.length;
  if (autoFallback && !last) {
    const next = currentSources[srcIdx + 1];
    showToast(`⚠️ ${s.name || 'Source'} failed — switching to ${next.name || 'next'}`);
    playSource(srcIdx + 1);
    return;
  }
  const wrap = $('#playerWrap');
  wrap.innerHTML = errorHTML(
    `${autoFallback ? 'All sources failed' : 'Source failed and auto-fallback is off'}.<br>Tried: ${currentSources.slice(0, srcIdx + 1).map(x => hostOf(x.url)).join(', ')}`,
    `playSource(${srcIdx})`
  ) + `<div class="sources">${currentSources.map((x, i) => `<button class="src-btn" onclick="playSource(${i})">${healthDot(x)} ${x.name} · ${x.quality || ''}</button>`).join('')}</div>`;
}

function saveProgress(pct) {
  const entry = { ...currentItem, progress: Math.round(pct) };
  const i = myContinue.findIndex(c => String(c.id) === String(currentItem.id));
  if (i >= 0) myContinue[i] = entry; else myContinue.unshift(entry);
  myContinue = myContinue.slice(0, 24);
  LS.set('mbx_continue', myContinue);
}

function goPiP() {
  const v = $('#playerWrap video');
  if (!v) return showToast('PiP works on direct video streams only');
  (document.pictureInPictureElement ? document.exitPictureInPicture() : v.requestPictureInPicture()).catch(() => showToast('PiP blocked'));
}

function startNextCountdown() {
  const ov = $('#nextOverlay');
  if (!ov || !nextInfo) return;
  ov.classList.add('show');
  $('#nextLabel').textContent = `Next: Season ${nextInfo.season} Episode ${nextInfo.episode}`;
  let n = 5;
  $('#nextCount').textContent = `Playing in ${n}s`;
  clearInterval(nextTimer);
  nextTimer = setInterval(() => {
    n--;
    $('#nextCount').textContent = `Playing in ${n}s`;
    if (n <= 0) playNextNow();
  }, 1000);
}
function cancelNext() { clearInterval(nextTimer); const o = $('#nextOverlay'); if (o) o.classList.remove('show'); }
function playNextNow() {
  if (!nextInfo || !currentEp) return cancelNext();
  cancelNext();
  playEpisode(currentEp.id, nextInfo.season, nextInfo.episode, null);
}

async function openTrailer(id) {
  $('#trailerModal').classList.add('open');
  $('#trailerWrap').innerHTML = '<div class="status">Loading trailer…</div>';
  try {
    const t = await api(`/api/movie/${encodeURIComponent(id)}/trailer`);
    $('#trailerWrap').innerHTML = `<iframe src="${t.url}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
  } catch (e) { $('#trailerWrap').innerHTML = errorHTML(e.message, 'closeTrailer()'); }
}
function closeTrailer() { $('#trailerModal').classList.remove('open'); $('#trailerWrap').innerHTML = ''; }
function closeModal() {
  $('#modalBackdrop').classList.remove('open');
  clearTimeout(srcTimer); cancelNext();
  $('#playerWrap').innerHTML = '';
  currentItem = null;
}

function enterAdult() {
  adultUnlocked = true;
  LS.set('mbx_age_ok', 1);
  $('#ageGate').classList.remove('open');
  switchTab('adult');
}
function leaveAdult() { $('#ageGate').classList.remove('open'); goHome(); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeTrailer(); } });

// 4K Ready badge
(async () => {
  try {
    const s = await api('/api/debrid/status');
    const b = $('#rdBadge');
    if (s.enabled) {
      b.textContent = '⚡ 4K Ready';
      b.classList.remove('off');
    } else {
      b.textContent = '⚡ 4K — set RD_API_KEY';
      b.classList.add('off');
    }
    debridStatus = s;
  } catch {
    const b = $('#rdBadge');
    b.textContent = '⚡ 4K';
    b.classList.add('off');
  }
})();

render();
</script>
