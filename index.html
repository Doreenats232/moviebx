<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieBox</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a12;--bg2:#12121e;--bg3:#1a1a2e;--bg4:#22223a;--accent:#e50914;--accent2:#ff2d38;--text:#fff;--text2:#b3b3b3;--text3:#666;--radius:10px}
        body{font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:var(--bg)}
        ::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
        a{color:inherit;text-decoration:none}

        /* NAV */
        .nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;padding:0 48px;height:64px;background:linear-gradient(180deg,rgba(10,10,18,.97),transparent);transition:.3s}
        .nav.scrolled{background:rgba(10,10,18,.98);backdrop-filter:blur(20px);box-shadow:0 2px 20px rgba(0,0,0,.5)}
        .logo{font-size:26px;font-weight:800;color:var(--accent);margin-right:40px;letter-spacing:-1px;cursor:pointer}
        .nav-links{display:flex;gap:28px;list-style:none}
        .nav-links a{color:var(--text2);font-size:14px;font-weight:500;transition:.2s;position:relative}
        .nav-links a:hover,.nav-links a.on{color:#fff}
        .nav-links a.on::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:2px;background:var(--accent);border-radius:1px}
        .nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
        .search{display:flex;align-items:center;background:var(--bg3);border:1px solid var(--bg4);border-radius:24px;padding:8px 14px;width:240px;transition:.3s}
        .search:focus-within{border-color:var(--accent);width:300px}
        .search input{background:none;border:none;outline:none;color:#fff;font-size:14px;width:100%;margin-left:6px}
        .search input::placeholder{color:var(--text3)}

        /* HERO */
        .hero{position:relative;height:70vh;min-height:450px;max-height:750px;overflow:hidden}
        .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;transition:opacity .8s}
        .hero-grad{position:absolute;inset:0;background:linear-gradient(to right,rgba(10,10,18,.97) 0%,rgba(10,10,18,.6) 50%,rgba(10,10,18,.3) 100%)}
        .hero-grad::after{content:'';position:absolute;bottom:0;left:0;right:0;height:180px;background:linear-gradient(transparent,var(--bg))}
        .hero-info{position:absolute;bottom:70px;left:48px;max-width:520px;z-index:2}
        .hero-title{font-size:44px;font-weight:800;line-height:1.1;margin-bottom:12px}
        .hero-meta{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:14px;color:var(--text2)}
        .hero-meta .stars{color:#f5c518;font-weight:700}
        .hero-desc{font-size:14px;line-height:1.7;color:var(--text2);margin-bottom:22px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .hero-btns{display:flex;gap:12px}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
        .btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent2);transform:scale(1.04)}
        .btn-s{background:rgba(255,255,255,.13);color:#fff;backdrop-filter:blur(8px)}.btn-s:hover{background:rgba(255,255,255,.22)}

        /* PILLS */
        .pills{display:flex;gap:10px;overflow-x:auto;padding:0 48px 20px;scrollbar-width:none}
        .pills::-webkit-scrollbar{display:none}
        .pill{flex:0 0 auto;padding:9px 20px;background:var(--bg3);border:1px solid var(--bg4);border-radius:24px;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap}
        .pill:hover,.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}

        /* ROWS */
        .row{padding:0 48px;margin-bottom:36px}
        .row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
        .row-title{font-size:20px;font-weight:700}
        .see-all{color:var(--accent);font-size:13px;font-weight:500}
        .see-all:hover{text-decoration:underline}
        .cards{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding-bottom:8px;scrollbar-width:none}
        .cards::-webkit-scrollbar{display:none}

        /* CARD */
        .card{flex:0 0 185px;cursor:pointer;transition:.3s;border-radius:var(--radius);overflow:visible}
        .card:hover{transform:scale(1.07);z-index:10}
        .card-img{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:var(--bg3)}
        .card-img img{width:100%;height:100%;object-fit:cover;transition:.3s}
        .card-img .ov{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.85));opacity:0;transition:.3s;display:flex;align-items:flex-end;padding:14px}
        .card:hover .ov{opacity:1}
        .ov .play{width:40px;height:40px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
        .card-rate{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:#f5c518;padding:3px 7px;border-radius:5px;font-size:11px;font-weight:700;backdrop-filter:blur(4px)}
        .card-title{padding:8px 2px 2px;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .card-year{padding:0 2px;font-size:11px;color:var(--text3)}

        /* MODAL */
        .overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
        .overlay.on{display:flex}
        .modal{background:var(--bg2);border-radius:16px;max-width:900px;width:100%;overflow:hidden;position:relative;animation:modalIn .3s ease}
        @keyframes modalIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .m-close{position:absolute;top:14px;right:14px;z-index:10;width:36px;height:36px;background:rgba(0,0,0,.6);border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
        .m-close:hover{background:var(--accent)}
        .m-bg{height:340px;background-size:cover;background-position:center;position:relative}
        .m-bg::after{content:'';position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(transparent,var(--bg2))}
        .m-body{padding:0 30px 30px;margin-top:-80px;position:relative;z-index:2}
        .m-info{display:flex;gap:22px}
        .m-poster{flex:0 0 170px;border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5)}
        .m-poster img{width:100%;display:block}
        .m-details{flex:1}
        .m-title{font-size:30px;font-weight:800;margin-bottom:10px}
        .m-meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;font-size:13px;color:var(--text2)}
        .m-meta .stars{color:#f5c518;font-weight:700}
        .m-genres{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
        .g-tag{padding:4px 11px;background:var(--bg4);border-radius:4px;font-size:12px;color:var(--text2)}
        .m-overview{font-size:14px;line-height:1.7;color:var(--text2);margin-bottom:22px}
        .m-actions{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap}
        .cast-s{margin-bottom:28px}.cast-s h3{font-size:16px;margin-bottom:10px}
        .cast-r{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}.cast-r::-webkit-scrollbar{display:none}
        .cast-c{flex:0 0 90px;text-align:center}
        .cast-c img{width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:6px;background:var(--bg3)}
        .cast-c .nm{font-size:11px;font-weight:600}.cast-c .ch{font-size:10px;color:var(--text3)}
        .sim-s h3{font-size:16px;margin-bottom:10px}

        /* EPISODES */
        .ep-list{max-height:380px;overflow-y:auto;margin-bottom:24px}
        .ep{display:flex;gap:14px;padding:10px;border-radius:8px;cursor:pointer;transition:.2s}
        .ep:hover{background:var(--bg3)}
        .ep-thumb{flex:0 0 120px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--bg3)}
        .ep-thumb img{width:100%;height:100%;object-fit:cover}
        .ep-info{flex:1}.ep-name{font-weight:600;font-size:14px;margin-bottom:3px}
        .ep-desc{font-size:12px;color:var(--text3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .ep-meta{font-size:11px;color:var(--text3);margin-top:4px}
        .sel{background:var(--bg3);border:1px solid var(--bg4);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:12px}

        /* PLAYER */
        .player{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.97);display:none;flex-direction:column}
        .player.on{display:flex}
        .p-head{display:flex;align-items:center;padding:14px 20px;gap:14px;flex-wrap:wrap}
        .p-close{width:38px;height:38px;background:rgba(255,255,255,.1);border:none;border-radius:8px;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
        .p-close:hover{background:var(--accent)}
        .p-title{font-size:16px;font-weight:600}
        .p-sources{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
        .src-btn{padding:7px 14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:7px;color:#fff;font-size:12px;cursor:pointer;transition:.2s}
        .src-btn:hover,.src-btn.on{background:var(--accent);border-color:var(--accent)}
        .p-frame{flex:1;padding:0 20px 20px}
        .p-frame iframe{width:100%;height:100%;border:none;border-radius:10px;background:#000}

        /* GRID PAGE */
        .gp{padding:20px 48px}
        .gp-title{font-size:30px;font-weight:800;margin-bottom:22px}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:18px}
        .grid .card{flex:none;width:100%}

        /* LOADING */
        .ld{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:15px}
        .spin{width:36px;height:36px;border:3px solid var(--bg4);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin-right:12px}
        @keyframes sp{to{transform:rotate(360deg)}}
        .empty{text-align:center;padding:80px 20px;color:var(--text3)}
        .empty .ic{font-size:48px;margin-bottom:14px}
        .empty p{margin-top:6px;font-size:13px}
        .setup{text-align:center;padding:120px 20px;max-width:500px;margin:0 auto}
        .setup h1{font-size:32px;font-weight:800;margin-bottom:12px}
        .setup p{color:var(--text2);line-height:1.7;margin-bottom:8px}
        .setup code{background:var(--bg3);padding:3px 8px;border-radius:4px;font-size:13px;color:var(--accent)}

        /* RESPONSIVE */
        @media(max-width:768px){
            .nav{padding:0 16px}.logo{font-size:22px;margin-right:16px}.nav-links{gap:14px}.nav-links a{font-size:13px}
            .search{width:150px}.search:focus-within{width:200px}
            .hero{height:50vh;min-height:340px}.hero-info{left:16px;bottom:36px;max-width:70%}.hero-title{font-size:26px}.hero-desc{-webkit-line-clamp:2}
            .row{padding:0 16px}.pills{padding:0 16px 14px}.card{flex:0 0 140px}
            .gp{padding:16px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
            .m-body{padding:0 16px 20px}.m-info{flex-direction:column}.m-poster{flex:none;max-width:180px}.m-title{font-size:22px}
            .p-head{padding:10px 14px}.p-frame{padding:0 10px 10px}
        }
    </style>
</head>
<body>

<nav class="nav" id="nav">
    <div class="logo" onclick="location.hash='/'">🎬 MovieBox</div>
    <ul class="nav-links">
        <li><a href="#/" data-n="home" class="on">Home</a></li>
        <li><a href="#/movies" data-n="movies">Movies</a></li>
        <li><a href="#/tv" data-n="tv">TV Shows</a></li>
        <li><a href="#/adult" data-n="adult">🔞 18+</a></li>
    </ul>
    <div class="nav-right">
        <div class="search">
            <span style="color:var(--text3)">🔍</span>
            <input type="text" id="q" placeholder="Search movies & shows...">
        </div>
    </div>
</nav>

<main id="app"></main>

<div class="overlay" id="detail">
    <div class="modal" id="modal"></div>
</div>

<div class="player" id="player">
    <div class="p-head">
        <button class="p-close" onclick="closePlayer()">✕</button>
        <span class="p-title" id="pTitle"></span>
        <div class="p-sources" id="pSrc"></div>
    </div>
    <div class="p-frame">
        <iframe id="pFrame" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>
</div>

<script>
const IMG='https://image.tmdb.org/t/p/',PS=IMG+'w342',PM=IMG+'w500',PB=IMG+'original';
let heroIdx=0,heroTmr=null;

function ph(t){return`data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750"><rect fill="#1a1a2e" width="500" height="750"/><text x="250" y="380" text-anchor="middle" fill="#555" font-family="sans-serif" font-size="16">${t||'No Image'}</text></svg>`)}`}
function yr(d){return d?d.slice(0,4):''}
function rt(v){return v?v.toFixed(1):'N/A'}
function rm(m){if(!m)return'';const h=Math.floor(m/60),s=m%60;return h?`${h}h ${s}m`:`${s}m`}
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}

async function api(p){const r=await fetch('/api'+p);if(!r.ok)throw new Error(await r.text());return r.json()}

function card(i){
    const tp=i.media_type||(i.first_air_date?'tv':'movie'),t=i.title||i.name,d=i.release_date||i.first_air_date;
    const img=i.poster_path?PS+i.poster_path:ph(t);
    return`<div class="card" onclick="openDetail(${i.id},'${tp}')"><div class="card-img"><img src="${img}" alt="${esc(t)}" loading="lazy" onerror="this.src='${ph(t)}'">${i.vote_average?`<div class="card-rate">★ ${rt(i.vote_average)}</div>`:''}<div class="ov"><div class="play">▶</div></div></div><div class="card-title">${t}</div><div class="card-year">${yr(d)}</div></div>`;
}

function adultCard(v){
    return`<div class="card" onclick="playAdult('${esc(v.embedUrl||v.url)}','${esc(v.title)}')"><div class="card-img"><img src="${v.thumbnail}" alt="${esc(v.title)}" loading="lazy" onerror="this.src='${ph(v.title)}'">${v.duration?`<div class="card-rate" style="background:rgba(229,9,20,.85);color:#fff;font-size:10px">${v.duration}</div>`:''}<div class="ov"><div class="play">▶</div></div></div><div class="card-title">${v.title}</div><div class="card-year" style="color:var(--accent)">${v.source}</div></div>`;
}

function row(title,items,href){
    if(!items||!items.length)return'';
    return`<div class="row"><div class="row-head"><h2 class="row-title">${title}</h2>${href?`<a href="${href}" class="see-all">See All →</a>`:''}</div><div class="cards">${items.map(card).join('')}</div></div>`;
}

function adultRow(title,items){
    if(!items||!items.length)return'';
    return`<div class="row"><div class="row-head"><h2 class="row-title">${title}</h2></div><div class="cards">${items.slice(0,30).map(adultCard).join('')}</div></div>`;
}

// ── HOME PAGE ──────────────────────────────────────

async function home(){
    const a=$('#app');a.innerHTML='<div class="ld"><div class="spin"></div>Loading...</div>';
    try{
        const[tr,top,act,com,hor,tv]=await Promise.all([api('/trending/all'),api('/top-rated/movie'),api('/discover/movie?genre=28'),api('/discover/movie?genre=35'),api('/discover/movie?genre=27'),api('/trending/tv')]);
        const hs=tr.results.slice(0,5),h=hs[0];
        a.innerHTML=`
            <div class="hero"><div class="hero-bg" id="hb" style="background-image:url('${PB}${h.backdrop_path||''}')"></div><div class="hero-grad"></div>
            <div class="hero-info" id="hi">
                <h1 class="hero-title" id="ht">${h.title||h.name}</h1>
                <div class="hero-meta" id="hm"><span class="stars">★ ${rt(h.vote_average)}</span><span>${yr(h.release_date||h.first_air_date)}</span><span>${h.media_type==='tv'?'TV Show':'Movie'}</span></div>
                <p class="hero-desc" id="hd">${h.overview||''}</p>
                <div class="hero-btns"><button class="btn btn-p" onclick="openDetail(${h.id},'${h.media_type}')">▶ Watch Now</button><button class="btn btn-s" onclick="openDetail(${h.id},'${h.media_type}')">ℹ More Info</button></div>
            </div></div>
            <div class="pills" id="pills"></div>
            ${row('Trending Now',tr.results)}${row('Top Rated',top.results)}${row('Action Movies',act.results)}${row('Comedy',com.results)}${row('Horror',hor.results)}${row('Popular TV Shows',tv.results)}`;
        heroIdx=0;if(heroTmr)clearInterval(heroTmr);
        heroTmr=setInterval(()=>{heroIdx=(heroIdx+1)%hs.length;const m=hs[heroIdx];const hb=$('#hb');if(!hb)return;hb.style.opacity='0';setTimeout(()=>{hb.style.backgroundImage=`url('${PB}${m.backdrop_path||''}')`;hb.style.opacity='1';$('#ht').textContent=m.title||m.name;$('#hm').innerHTML=`<span class="stars">★ ${rt(m.vote_average)}</span><span>${yr(m.release_date||m.first_air_date)}</span><span>${m.media_type==='tv'?'TV Show':'Movie'}</span>`;$('#hd').textContent=m.overview||'';},400)},7000);
        loadPills();
    }catch(e){a.innerHTML=`<div class="empty"><div class="ic">⚠️</div><h3>Failed to load</h3><p>${e.message}</p></div>`}
}

async function loadPills(){
    try{const d=await api('/genres/movie');const p=$('#pills');if(p)p.innerHTML=d.genres.map(g=>`<a class="pill" href="#/genre/${g.id}/${encodeURIComponent(g.name)}">${g.name}</a>`).join('')}catch(e){}
}

// ── SEARCH PAGE ────────────────────────────────────

async function searchPg(q){
    const a=$('#app');a.innerHTML='<div class="ld"><div class="spin"></div>Searching...</div>';
    try{const d=await api(`/search?q=${encodeURIComponent(q)}`);const r=d.results.filter(x=>x.media_type!=='person');
    a.innerHTML=`<div class="gp"><h1 class="gp-title">Results for "${q}"</h1>${r.length?`<div class="grid">${r.map(card).join('')}</div>`:`<div class="empty"><div class="ic">🔍</div><p>No results found</p></div>`}</div>`}
    catch(e){a.innerHTML=`<div class="empty"><div class="ic">⚠️</div><p>${e.message}</p></div>`}
}

// ── GENRE PAGE ─────────────────────────────────────

async function genrePg(id,name){
    const a=$('#app');a.innerHTML='<div class="ld"><div class="spin"></div>Loading...</div>';
    try{const d=await api(`/discover/movie?genre=${id}`);a.innerHTML=`<div class="gp"><h1 class="gp-title">${decodeURIComponent(name)}</h1><div class="grid">${d.results.map(card).join('')}</div></div>`}
    catch(e){a.innerHTML=`<div class="empty"><div class="ic">⚠️</div><p>${e.message}</p></div>`}
}

// ── MOVIES PAGE ────────────────────────────────────

async function moviesPg(){
    const a=$('#app');a.innerHTML='<div class="ld"><div class="spin"></div>Loading...</div>';
    try{const[pop,now,up,top]=await Promise.all([api('/trending/movie'),api('/now-playing'),api('/discover/movie?sort_by=release_date.desc'),api('/top-rated/movie')]);
    a.innerHTML=`<div class="gp"><h1 class="gp-title">Movies</h1><div class="pills" id="pills"></div>${row('Popular',pop.results)}${row('Now Playing',now.results)}${row('Upcoming',up.results)}${row('Top Rated',top.results)}</div>`;loadPills()}
    catch(e){a.innerHTML=`<div class="empty"><div class="ic">⚠️</div><p>${e.message}</p></div>`}
}

// ── TV PAGE ────────────────────────────────────────

async function tvPg(){
    const a=$('#app');a.innerHTML='<div class="ld"><div class="spin"></div>Loading...</div>';
    try{const[pop,top,air]=await Promise.all([api('/trending/tv'),api('/top-rated/tv'),api('/discover/tv?sort_by=first_air_date.desc')]);
    a.innerHTML=`<div class="gp"><h1 class="gp-title">TV Shows</h1>${row('Popular',pop.results)}${row('Top Rated',top.results)}${row('Recently Aired',air.results)}</div>`}
    catch(e){a.innerHTML=`<div class="empty"><div class="ic">⚠️</div><p>${e.message}</p></div>`}
}

// ── ADULT PAGE ─────────────────────────────────────

async function adultPg(q){
    const a=$('#app');a.innerHTML='<div class="ld"><div class="spin"></div>Loading adult content...</div>';
    try{
        const src = q ? 'search' : 'trending';
        const qParam = q ? `?q=${encodeURIComponent(q)}` : '';
        const d = await api(`/adult/${src}${qParam}`);

        const cats=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
            <button class="pill" onclick="adultPg()">🔥 Trending</button>
            <button class="pill" onclick="adultPg('full movie')">🎬 Full Movies</button>
            <button class="pill" onclick="adultPg('milf')"> MILF</button>
            <button class="pill" onclick="adultPg('teen')">👩 Teen</button>

// ── DETAIL MODAL ───────────────────────────────────

async function openDetail(id,tp){
    const ov=$('#detail'),m=$('#modal');ov.classList.add('on');document.body.style.overflow='hidden';
    m.innerHTML='<div class="ld"><div class="spin"></div>Loading...</div>';
    try{
        const d=await api(`/${tp}/${id}`);const t=d.title||d.name,dt=d.release_date||d.first_air_date;
        const poster=d.poster_path?PM+d.poster_path:ph(t),bg=d.backdrop_path?PB+d.backdrop_path:'';
        const gs=d.genres||[],cast=(d.credits?.cast||[]).slice(0,12),sim=(d.similar?.results||[]).slice(0,12);
        const isTV=tp==='tv';
        let epHTML='';
        if(isTV&&d.seasons?.length){
            const ss=d.seasons.filter(s=>s.season_number>0);
            epHTML=`<div class="cast-s"><h3>Episodes</h3><select class="sel" id="ss" onchange="loadEps(${id},this.value)">${ss.map(s=>`<option value="${s.season_number}">Season ${s.season_number}</option>`).join('')}</select><div class="ep-list" id="eps"><div class="ld"><div class="spin"></div>Loading...</div></div></div>`;
        }
        m.innerHTML=`<button class="m-close" onclick="closeDetail()">✕</button>
            <div class="m-bg" style="background-image:url('${bg}')"></div>
            <div class="m-body"><div class="m-info"><div class="m-poster"><img src="${poster}" alt="${esc(t)}"></div><div class="m-details">
                <h1 class="m-title">${t} <span style="color:var(--text3);font-weight:400;font-size:22px">(${yr(dt)})</span></h1>
                <div class="m-meta"><span class="stars">★ ${rt(d.vote_average)}</span>${d.runtime?`<span>${rm(d.runtime)}</span>`:''}${isTV&&d.number_of_seasons?`<span>${d.number_of_seasons} Season${d.number_of_seasons>1?'s':''}</span>`:''}<span>${yr(dt)}</span></div>
                <div class="m-genres">${gs.map(g=>`<span class="g-tag">${g.name}</span>`).join('')}</div>
                <p class="m-overview">${d.overview||'No description available.'}</p>
                <div class="m-actions"><button class="btn btn-p" onclick="playItem(${id},'${tp}','${esc(t)}')">▶ Watch Now</button></div>
            </div></div>
            ${cast.length?`<div class="cast-s"><h3>Cast</h3><div class="cast-r">${cast.map(c=>`<div class="cast-c"><img src="${c.profile_path?PM+c.profile_path:ph(c.name)}" alt="${esc(c.name)}" loading="lazy"><div class="nm">${c.name}</div><div class="ch">${c.character||''}</div></div>`).join('')}</div></div>`:''}
            ${epHTML}
            ${sim.length?`<div class="sim-s"><h3>You May Also Like</h3><div class="cards">${sim.map(card).join('')}</div></div>`:''}
        </div>`;
        if(isTV&&d.seasons?.length){const ss=d.seasons.filter(s=>s.season_number>0);if(ss.length)loadEps(id,ss[0].season_number)}
    }catch(e){m.innerHTML=`<button class="m-close" onclick="closeDetail()">✕</button><div class="empty" style="padding:80px"><div class="ic">⚠️</div><p>${e.message}</p></div>`}
}

async function loadEps(tvId,s){
    const el=$('#eps');if(!el)return;el.innerHTML='<div class="ld"><div class="spin"></div>Loading...</div>';
    try{const d=await api(`/tv/${tvId}/season/${s}`);
    if(d.episodes?.length){el.innerHTML=d.episodes.map(e=>`<div class="ep" onclick="playEp(${tvId},${s},${e.episode_number},'S${s}E${e.episode_number}: ${esc(e.name)}')"><div class="ep-thumb"><img src="${e.still_path?PM+e.still_path:ph('E'+e.episode_number)}" loading="lazy"></div><div class="ep-info"><div class="ep-name">${e.episode_number}. ${e.name}</div><div class="ep-desc">${e.overview||'No description.'}</div><div class="ep-meta">${e.runtime?rm(e.runtime):''} ${e.air_date?'· '+e.air_date:''}</div></div></div>`).join('')}
    else el.innerHTML='<div style="padding:16px;color:var(--text3)">No episodes found.</div>'}
    catch(e){el.innerHTML=`<div style="padding:16px;color:var(--text3)">${e.message}</div>`}
}

function closeDetail(){$('#detail').classList.remove('on');document.body.style.overflow=''}

// ── PLAYER ─────────────────────────────────────────

async function playItem(id,tp,title){
    const pl=$('#player');$('#pTitle').textContent=title;pl.classList.add('on');document.body.style.overflow='hidden';
    try{const d=await api(`/${tp==='tv'?'tv':'movie'}/${id}/streams`);
    $('#pSrc').innerHTML=d.sources.map((s,i)=>`<button class="src-btn${i?'':' on'}" onclick="swSrc(this,'${esc(s.url)}')">${s.name}</button>`).join('');
    if(d.sources.length)$('#pFrame').src=d.sources[0].url}catch(e){$('#pSrc').innerHTML='<span style="color:var(--text3)">No sources</span>'}
}

async function playEp(tvId,s,e,title){
    const pl=$('#player');$('#pTitle').textContent=title;pl.classList.add('on');document.body.style.overflow='hidden';
    try{const d=await api(`/tv/${tvId}/${s}/${e}/streams`);
    $('#pSrc').innerHTML=d.sources.map((x,i)=>`<button class="src-btn${i?'':' on'}" onclick="swSrc(this,'${esc(x.url)}')">${x.name}</button>`).join('');
    if(d.sources.length)$('#pFrame').src=d.sources[0].url}catch(er){$('#pSrc').innerHTML='<span style="color:var(--text3)">No sources</span>'}
}

function playAdult(url,title){
    const pl=$('#player');$('#pTitle').textContent=title;pl.classList.add('on');document.body.style.overflow='hidden';
    $('#pSrc').innerHTML='<button class="src-btn on">Direct</button>';
    $('#pFrame').src=url;
}

function swSrc(b,u){document.querySelectorAll('.src-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#pFrame').src=u}
function closePlayer(){$('#player').classList.remove('on');$('#pFrame').src='';document.body.style.overflow=''}

// ── ROUTER ─────────────────────────────────────────

function $(s){return document.querySelector(s)}

function route(){
    const h=location.hash||'#/',p=h.replace('#/','').split('/');
    closeDetail();closePlayer();
    document.querySelectorAll('.nav-links a').forEach(a=>a.classList.remove('on'));
    if(!p[0]||p[0]==='home'||p[0]===''){$('[data-n="home"]').classList.add('on');home()}
    else if(p[0]==='search'){const u=new URLSearchParams(h.split('?')[1]||'');searchPg(u.get('q')||'')}
    else if(p[0]==='genre'&&p[1])genrePg(p[1],p[2]||'')
    else if(p[0]==='movies'){$('[data-n="movies"]').classList.add('on');moviesPg()}
    else if(p[0]==='tv'){$('[data-n="tv"]').classList.add('on');tvPg()}
    else if(p[0]==='adult'){$('[data-n="adult"]').classList.add('on');adultPg()}
    else home();
    window.scrollTo(0,0);
}

// ── EVENTS ─────────────────────────────────────────

$('#q').addEventListener('keyup',e=>{if(e.key==='Enter'&&e.target.value.trim())location.hash=`#/search?q=${encodeURIComponent(e.target.value.trim())}`});
$('#detail').addEventListener('click',e=>{if(e.target.classList.contains('overlay'))closeDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePlayer();closeDetail()}});
window.addEventListener('scroll',()=>$('#nav').classList.toggle('scrolled',scrollY>50));
window.addEventListener('hashchange',route);

// ── INIT ───────────────────────────────────────────

(async()=>{
    try{const c=await api('/config');if(!c.hasKey){$('#app').innerHTML=`<div class="setup"><h1>🎬 MovieBox</h1><p>Add your free TMDB API key to <code>.env</code>:</p><p><code>TMDB_API_KEY=your_key_here</code></p><p style="margin-top:16px">Get a free key at:</p><p><a href="https://www.themoviedb.org/settings/api" style="color:var(--accent)" target="_blank">themoviedb.org/settings/api</a></p><p style="margin-top:20px">Then restart the server.</p></div>`;return}}catch(e){}
    route();
})();
</script>
